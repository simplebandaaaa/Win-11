name: Windows RDP + Hyper-V

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==============================
      # CREATE RDP USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"
          $password = "RdpRunner#A7x9!Q2m"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction Stop
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP User" `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction Stop

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user created successfully."


      # ==============================
      # ENABLE RDP
      # ==============================
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configured."


      # ==============================
      # ENABLE HYPER-V
      # ==============================
      - name: Enable Hyper-V
        shell: powershell
        run: |
          Write-Host "Enabling Hyper-V..."

          Enable-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All `
            -All `
            -NoRestart

          Write-Host ""
          Write-Host "Hyper-V status:"

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      # ==============================
      # CHECK HYPER-V
      # ==============================
      - name: Check Hyper-V
        shell: powershell
        run: |
          Write-Host "Checking Hyper-V commands..."

          $commands = @(
            "Get-VM",
            "New-VM",
            "Get-VMSwitch",
            "New-VMSwitch"
          )

          foreach ($command in $commands) {
              if (Get-Command $command -ErrorAction SilentlyContinue) {
                  Write-Host "$command : AVAILABLE"
              }
              else {
                  Write-Host "$command : NOT AVAILABLE"
              }
          }


      # ==============================
      # INSTALL TAILSCALE
      # ==============================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force

          Write-Host "Tailscale installed."


      # ==============================
      # CONNECT TAILSCALE
      # ==============================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 1; $i -le 12; $i++) {

              $ip = (& $tailscale ip -4 2>$null |
                Select-Object -First 1).Trim()

              if ($ip) {
                  break
              }

              Write-Host "Waiting for Tailscale IP..."
              Start-Sleep -Seconds 5
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale connected."


      # ==============================
      # TEST RDP
      # ==============================
      - name: Test RDP
        shell: powershell
        run: |
          Write-Host "Testing RDP port 3389..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP port is reachable."


      # ==============================
      # SHOW RDP INFORMATION
      # ==============================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP READY"
          Write-Host "=========================================="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Hyper-V status:"

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      # ==============================
      # KEEP RUNNER ALIVE
      # ==============================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is active."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
