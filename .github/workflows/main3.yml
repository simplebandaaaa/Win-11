name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==============================
      # 1. Configure Windows RDP
      # ==============================
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force


      # ==============================
      # 2. Create RDP User
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD secret not found."
            Write-Host "Generating a temporary password..."

            $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%'

            $password = -join (
              1..16 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          }
          else {

            $password = $env:RDP_PASSWORD_SECRET

          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existing) {

            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword

          }
          else {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==============================
      # 3. Install Tailscale
      # ==============================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force


      # ==============================
      # 4. Connect Tailscale
      # ==============================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {

            Write-Error "TAILSCALE_AUTH_KEY secret is required."

            exit 1
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="gh-android-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {

            $tsIP = & $ts ip -4 |
              Select-Object -First 1

            if (-not [string]::IsNullOrWhiteSpace($tsIP)) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {

            Write-Error "Tailscale IP was not assigned."

            exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==============================
      # 5. Install QEMU
      # ==============================
      - name: Install QEMU
        shell: powershell
        run: |

          choco install qemu `
            -y `
            --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if (-not $qemu) {

            Write-Error "QEMU installation failed."

            exit 1
          }

          Write-Host "QEMU:"
          Write-Host $qemu.Source


      # ==============================
      # 6. Download Android-x86
      # ==============================
      - name: Download Android-x86
        shell: powershell
        run: |

          $androidDir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $androidDir |
            Out-Null

          $iso = "$androidDir\android-x86.iso"

          $url = "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          Write-Host "Downloading Android-x86..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $iso

          if (-not (Test-Path $iso)) {

            Write-Error "Android ISO download failed."

            exit 1
          }

          Write-Host "Android ISO downloaded successfully."


      # ==============================
      # 7. Create VM Disk
      # ==============================
      - name: Create Android VM Disk
        shell: powershell
        run: |

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          qemu-img create `
            -f qcow2 `
            $disk `
            16G

          if (-not (Test-Path $disk)) {

            Write-Error "VM disk creation failed."

            exit 1
          }

          Write-Host "16 GB Android VM disk created."


      # ==============================
      # 8. Start Android VM
      # ==============================
      - name: Start Android VM
        shell: powershell
        run: |

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86.iso"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          $qemu = (
            Get-Command qemu-system-x86_64.exe
          ).Source

          Write-Host "Starting Android VM..."

          $arguments = @(
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
