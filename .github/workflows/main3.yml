name: Ubuntu XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install XFCE XRDP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xrdp dbus-x11

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Configure XFCE XRDP
        run: |
          sudo bash -c 'cat > /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          exec dbus-run-session -- startxfce4
          EOF'

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo -u rdpuser bash -c 'cat > ~/.xsession <<EOF
          exec dbus-run-session -- startxfce4
          EOF'

      - name: Restart XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo systemctl --no-pager status xrdp
          sudo ss -lntp | grep ':3389'

      - name: Check Tailscale secret
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          test -n "$TS_KEY" || {
            echo "TAILSCALE_AUTHKEY missing"
            exit 1
          }
          echo "Tailscale secret found"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show connection details
        run: |
          sleep 5
          echo "=============================="
          echo "TAILSCALE IP:"
          sudo tailscale ip -4
          echo "=============================="
          echo "RDP USER: rdpuser"
          echo "RDP PASSWORD: Ubuntu@12345"
          echo "RDP PORT: 3389"
          echo "=============================="

      - name: Keep alive
        run: |
          while true; do
            sleep 60
          done
