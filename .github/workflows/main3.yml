name: Ubuntu 24.04 LXQt RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install LXQt and XRDP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            lxqt \
            lxqt-session \
            xrdp \
            dbus-x11

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd

      - name: Configure LXQt
        run: |
          sudo -u rdpuser bash -c 'printf "%s\n" "startlxqt" > /home/rdpuser/.xsession'

          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod 755 /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg:/etc
          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt
          export DESKTOP_SESSION=LXQt

          exec dbus-run-session -- startlxqt
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

      - name: Start XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo ss -lntp | grep ':3389'

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show connection details
        run: |
          sleep 3
          echo "================================"
          echo "TAILSCALE IP:"
          sudo tailscale ip -4
          echo "================================"
          echo "RDP USER: rdpuser"
          echo "RDP PASSWORD: Ubuntu@12345"
          echo "RDP PORT: 3389"
          echo "================================"

      - name: Keep alive
        run: |
          while true; do
            sleep 60
          done
