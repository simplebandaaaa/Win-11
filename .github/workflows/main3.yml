name: Windows RDP Android VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {
            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )
          }
          else {
            $password = $env:RDP_PASSWORD_SECRET
          }

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $secure `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "RDP" `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 300

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe not found."
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="android-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {
            $result = & $ts ip -4 2>$null

            foreach ($line in $result) {
              $candidate = $line.ToString().Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $candidate
                break
              }
            }

            if ($ip) {
              break
            }

            Start-Sleep 3
          }

          if (!$ip) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install qemu --yes --no-progress

          $qemu = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "qemu-system-x86_64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$qemu) {
            throw "QEMU was not found."
          }

          "QEMU_PATH=$($qemu.FullName)" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

          & $qemu.FullName --version

      - name: Download Android ISO From Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $dir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          $iso = "$dir\android-x86_64-9.0-r2-k49.iso"

          gh release download `
            android-9.0-r2-k49 `
            --repo "${{ github.repository }}" `
            --pattern "android-x86_64-9.0-r2-k49.iso" `
            --dir "$dir" `
            --clobber

          if (!(Test-Path $iso)) {
            throw "Android ISO is missing from release."
          }

          $size = (Get-Item $iso).Length

          if ($size -lt 800MB) {
            throw "Downloaded file is too small."
          }

          $hash = (
            Get-FileHash `
              $iso `
              -Algorithm SHA1
          ).Hash.ToLower()

          $expected = "9975ee08cd2420f11101e3acb102930dd07e5e5f"

          if ($hash -ne $expected) {
            throw "Android K49 SHA1 verification failed."
          }

          Write-Host "Android K49 ISO verified."

      - name: Create VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qemuDir = Split-Path `
            $env:QEMU_PATH `
            -Parent

          $qimg = Join-Path `
            $qemuDir `
            "qemu-img.exe"

          if (!(Test-Path $qimg)) {
            throw "qemu-img.exe not found."
          }

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          & $qimg `
            create `
            -f qcow2 `
            $disk `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "Disk creation failed."
          }

      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86_64-9.0-r2-k49.iso"
          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          $args = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-device", "usb-tablet",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-vnc", "127.0.0.1:1"
          )

          $vm = Start-Process `
            -FilePath $env:QEMU_PATH `
            -ArgumentList $args `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep 15

          if ($vm.HasExited) {
            throw "Android VM exited. Code: $($vm.ExitCode)"
          }

          Write-Host "Android VM started."
          Write-Host "PID: $($vm.Id)"

      - name: Show Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP CONNECTION"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "======================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            $vm = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if (!$vm) {
              throw "Android VM stopped."
            }

            Write-Host "[$(Get-Date)] Android VM + RDP active."

            Start-Sleep -Seconds 300
          }
