name: Windows RDP + Hyper-V

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==============================
      # 1. CREATE RDP USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"
          $password = "RdpRunner#A7x9!Q2m"

          Write-Host "Creating RDP account..."

          # Delete existing account if present
          net user $username /delete 2>$null

          # Create account
          net user $username $password /add

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create RDP account."
              net accounts
              exit 1
          }

          # Password never expires
          net user $username /passwordchg:no
          net user $username /expires:never

          # Add Administrator rights
          net localgroup Administrators $username /add

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to add RDP user to Administrators."
              exit 1
          }

          # Add RDP rights
          net localgroup "Remote Desktop Users" $username /add

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to add RDP user to Remote Desktop Users."
              exit 1
          }

          # Save password for later step
          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user created successfully."


      # ==============================
      # 2. ENABLE RDP
      # ==============================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Require Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Default RDP security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Enable Windows RDP firewall rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configured successfully."


      # ==============================
      # 3. ENABLE HYPER-V
      # ==============================
      - name: Enable Hyper-V
        shell: powershell
        run: |
          Write-Host "Enabling Hyper-V..."

          Enable-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All `
            -All `
            -NoRestart

          Write-Host ""
          Write-Host "Hyper-V feature status:"

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      # ==============================
      # 4. CHECK HYPER-V
      # ==============================
      - name: Check Hyper-V
        shell: powershell
        run: |
          Write-Host "Checking Hyper-V..."

          $hyperv = Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All

          Write-Host "Feature: $($hyperv.FeatureName)"
          Write-Host "State:   $($hyperv.State)"

          Write-Host ""
          Write-Host "Hyper-V PowerShell commands:"

          $commands = @(
            "Get-VM",
            "New-VM",
            "Get-VMSwitch",
            "New-VMSwitch"
          )

          foreach ($cmd in $commands) {
              if (Get-Command $cmd -ErrorAction SilentlyContinue) {
                  Write-Host "$cmd : AVAILABLE"
              }
              else {
                  Write-Host "$cmd : NOT AVAILABLE"
              }
          }


      # ==============================
      # 5. INSTALL TAILSCALE
      # ==============================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-
