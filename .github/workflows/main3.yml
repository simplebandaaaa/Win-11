name: Ubuntu 24.04 XFCE RDP

on:
  workflow_dispatch:

jobs:
  ubuntu-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 3600

    steps:
      - name: Update Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Install XFCE and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      - name: Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          PASSWORD="${RDP_PASSWORD:-SecurePass@2026!}"

          if ! id rdpuser >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash rdpuser
          fi

          echo "rdpuser:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo rdpuser

          echo "startxfce4" | sudo tee /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod 644 /home/rdpuser/.xsession

      - name: Configure XRDP
        run: |
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5
          sudo systemctl --no-pager status xrdp || true

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-ubuntu-${GITHUB_RUN_ID}"

          sleep 5

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP was not assigned"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify XRDP
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          sudo ss -lntp | grep ':3389' || {
            echo "XRDP is not listening on port 3389"
            sudo systemctl status xrdp --no-pager
            exit 1
          }

          echo "XRDP is listening on port 3389"

      - name: Test RDP Port
        run: |
          for i in {1..10}; do
            if timeout 3 bash -c \
              "</dev/tcp/$TAILSCALE_IP/3389" 2>/dev/null; then
              echo "RDP port is reachable"
              exit 0
            fi

            echo "Waiting for RDP..."
            sleep 5
          done

          echo "RDP port 3389 test failed"
          exit 1

      - name: Show RDP Information
        run: |
          echo ""
          echo "======================================"
          echo "       UBUNTU 24.04 XFCE RDP"
          echo "======================================"
          echo "Address : $TAILSCALE_IP"
          echo "Port    : 3389"
          echo "User    : rdpuser"
          echo "Desktop : XFCE"
          echo "======================================"
          echo ""

          echo "Use Microsoft Remote Desktop:"
          echo "Computer: $TAILSCALE_IP:3389"
          echo "Username: rdpuser"

      - name: Keep RDP Alive
        run: |
          while true; do
            echo "[$(date)] Ubuntu XFCE RDP is running..."
            sleep 300
          done
