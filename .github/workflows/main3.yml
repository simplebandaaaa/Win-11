name: Ubuntu XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Update system
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      - name: Install XFCE and xrdp
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp dbus-x11

      - name: Configure XFCE for xrdp
        run: |
          echo "startxfce4" > ~/.xsession

          sudo bash -c 'cat > /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          startxfce4
          EOF'

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Start xrdp
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl status xrdp --no-pager

      - name: Keep runner alive
        run: |
          echo "================================="
          echo "Ubuntu XFCE RDP is running"
          echo "Username: rdpuser"
          echo "Password: Ubuntu@12345"
          echo "================================="
          sleep 21600
