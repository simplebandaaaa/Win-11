name: Linux RDP

on:
  workflow_dispatch:

jobs:
  secure-linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub runner max execution limit (6 hours)

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 netcat-openbsd
          
          # Set XFCE as the default desktop for XRDP
          echo "xfce4-session" > ~/.xsession
          
          # Configure XRDP permissions
          sudo adduser xrdp ssl-cert

      - name: Create RDP User
        run: |
          USERNAME="rdpuser"
          PASSWORD="${{ secrets.MY_RDP_PASSWORD }}"
          
          if [ -z "$PASSWORD" ]; then
            PASSWORD="SecurePass@2026!"
          fi

          # Hide password from GitHub workflow logs
          echo "::add-mask::$PASSWORD"

          # Create user and set password
          sudo useradd -m -s /bin/bash $USERNAME
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USERNAME

          echo "RDP_USER=$USERNAME" >> $GITHUB_ENV
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install & Configure Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-linux-runner-$GITHUB_RUN_ID

          # Get Tailscale IPv4 address
          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Failed to get Tailscale IP"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Start & Verify RDP Port Status
        run: |
          # Stop any background service conflicts
          sudo service xrdp stop || true
          
          # Manually start both session manager and main RDP daemon
          sudo xrdp-sesman
          sudo xrdp
          
          # Wait 3 seconds for port binding
          sleep 3
          
          # Test local port connectivity
          nc -zv 127.0.0.1 3389 || exit 1

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== LINUX RDP ACCESS ESTABLISHED ==="
          echo "IP Address: $TAILSCALE_IP"
          echo "Username:   $RDP_USER"
          echo "Password:   [HIDDEN BY LOG MASK]"
          echo "RDP Port:   3389"
          echo "===================================="
          echo ""

          while true; do
            echo "[$(date)] Linux RDP Active..."
            sleep 300
          done
