name: Linux RDP

on:
  workflow_dispatch:

jobs:
  secure-linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp \
            netcat-openbsd

          sudo adduser xrdp ssl-cert

      - name: Create RDP User & Setup Desktop Session
        run: |
          USERNAME="rdpuser"
          PASSWORD="${{ secrets.MY_RDP_PASSWORD }}"
          
          if [ -z "$PASSWORD" ]; then
            PASSWORD="SecurePass@2026!"
          fi

          echo "::add-mask::$PASSWORD"

          # User creation
          sudo useradd -m -s /bin/bash $USERNAME
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USERNAME

          # XFCE Session wrapper (No polkit required)
          sudo bash -c 'cat << "EOF" > /home/rdpuser/.xsession
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS="/etc/xdg"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"
          exec dbus-run-session xfce4-session
          EOF'

          # Fix permissions
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

          echo "RDP_USER=$USERNAME" >> $GITHUB_ENV
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install & Configure Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-linux-runner-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Failed to get Tailscale IP"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Start & Verify RDP Port Status
        run: |
          sudo service xrdp stop || true
          
          # Force start daemons
          sudo xrdp-sesman
          sudo xrdp
          
          sleep 3
          nc -zv 127.0.0.1 3389 || exit 1

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== LINUX RDP ACCESS ESTABLISHED ==="
          echo "IP Address: $TAILSCALE_IP"
          echo "Username:   $RDP_USER"
          echo "Password:   [HIDDEN BY LOG MASK]"
          echo "RDP Port:   3389"
          echo "===================================="
          echo ""

          while true; do
            echo "[$(date)] Linux RDP Active..."
            sleep 300
          done
