name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Configure Windows RDP
      # ==========================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "RDP configured successfully."


      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD not found."
            Write-Host "Generating temporary password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          }
          else {
            $password = $env:RDP_PASSWORD_SECRET
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          }
          else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user configured."


      # ==========================================
      # 3. Install Tailscale & VNC Viewer
      # ==========================================
      - name: Install Tailscale and VNC Viewer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 300

          if (!(Test-Path $installer)) {
            throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."
          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe was not found after installation."
          }

          Write-Host "Tailscale installed successfully."

          # Installing TigerVNC Viewer to view Android screen inside RDP
          Write-Host "Installing TigerVNC Viewer..."
          choco install tigervnc-viewer -y --no-progress


      # ==========================================
      # 4. Start Tailscale Service
      # ==========================================
      - name: Start Tailscale Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service was not found."
          }

          if ($service.Status -ne "Running") {

            Write-Host "Starting Tailscale service..."

            Start-Service `
              -Name "Tailscale"

            Start-Sleep -Seconds 5
          }

          $service = Get-Service `
            -Name "Tailscale"

          Write-Host "Tailscale service status: $($service.Status)"


      # ==========================================
      # 5. Connect Tailscale
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Connecting to Tailscale..."

          & $ts up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "===== TAILSCALE STATUS ====="
            & $ts status

            throw "Tailscale connection failed."
          }

          Write-Host "Waiting for Tailscale IPv4..."

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            Write-Host "Attempt $i/20"
            $output = & $ts ip -4 2>&1

            foreach ($line in $output) {
              $value = $line.ToString().Trim()
              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $tsIP = $value
                break
              }
            }

            if (![string]::IsNullOrWhiteSpace($tsIP)) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            throw "Tailscale IPv4 address was not assigned."
          }

          Write-Host "===================================="
          Write-Host "Tailscale connected successfully"
          Write-Host "IPv4: $tsIP"
          Write-Host "===================================="

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 6. Install QEMU
      # ==========================================
      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu `
            -y `
            --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $qemu) {

            $paths = @(
              "$env:ProgramFiles\qemu\qemu-system-x86_64.exe",
              "$env:ChocolateyInstall\bin\qemu-system-x86_64.exe"
            )

            foreach ($path in $paths) {

              if (Test-Path $path) {
                $qemu = Get-Item $path
                break
              }
            }
          }

          if ($null -eq $qemu) {
            throw "QEMU executable was not found."
          }

          Write-Host "QEMU found:"
          Write-Host $qemu.Source

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 7. Download Android-x86 ISO (FIXED WITH CURL)
      # ==========================================
      - name: Download Android-x86
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $androidDir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $androidDir `
            -Force |
            Out-Null

          $iso = "$androidDir\android-x86.iso"
          $url = "https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"

          Write-Host "Downloading Android-x86 ISO using curl..."
          
          # curl.exe -L flag redirects ko properly follow karta hai
          curl.exe -L -o "$iso" "$url"

          if (!(Test-Path $iso)) {
            throw "Android ISO file was not created."
          }

          $size = (Get-Item $iso).Length
          Write-Host "Downloaded file size: $size bytes"

          if ($size -lt 100MB) {
            throw "Downloaded ISO file is corrupted or too small ($size bytes)."
          }

          Write-Host "Android-x86 ISO downloaded successfully!"


      # ==========================================
      # 8. Create Android VM Disk
      # ==========================================
      - name: Create Android VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          Write-Host "Creating 16 GB Android VM disk..."

          & qemu-img.exe `
            create `
            -f qcow2 `
            "$disk" `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "qemu-img failed."
          }

          if (!(Test-Path $disk)) {
            throw "Android VM disk was not created."
          }

          Write-Host "Android VM disk created successfully."


      # ==========================================
      # 9. Start Android VM
      # ==========================================
      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86.iso"
          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"
          $qemu = $env:QEMU_PATH

          if (!(Test-Path $qemu)) { throw "QEMU not found: $qemu" }
          if (!(Test-Path $iso)) { throw "Android ISO not found." }
          if (!(Test-Path $disk)) { throw "Android VM disk not found." }

          Write-Host "Starting Android VM..."

          $arguments = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-vnc", "127.0.0.1:1"
          )

          $vm = Start-Process `
            -FilePath $qemu `
            -ArgumentList $arguments `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {
            Write-Host "QEMU exited immediately."
            Write-Host "Exit code: $($vm.ExitCode)"
            throw "Android VM failed to start."
          }

          Write-Host "Android VM is running."
          Write-Host "QEMU PID: $($vm.Id)"

          "QEMU_PID=$($vm.Id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 10. Verify RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP service..."

          $service = Get-Service -Name "TermService"
          Write-Host "RDP service: $($service.Status)"

          if ($service.Status -ne "Running") {
            Restart-Service -Name "TermService" -Force
            Start-Sleep -Seconds 5
          }

          Write-Host "Checking local RDP port 3389..."

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$result.TcpTestSucceeded) {
            throw "RDP port 3389 is not available."
          }

          Write-Host "RDP port 3389 is listening."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"


      # ==========================================
      # 11. Show Connection Details
      # ==========================================
      - name: Show Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP CONNECTION"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              ANDROID VM"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "To view Android Screen inside RDP:"
          Write-Host "1. Connect to RDP using above credentials."
          Write-Host "2. Open TigerVNC Viewer on RDP desktop."
          Write-Host "3. Connect to server address: 127.0.0.1:5901"
          Write-Host ""
          Write-Host "=========================================="


      # ==========================================
      # 12. Keep Runner Alive
      # ==========================================
      - name: Keep RDP And Android Alive
        shell: powershell
        run: |
          Write-Host "RDP + Android VM is active."

          while ($true) {

            $qemu = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if ($null -eq $qemu) {
              Write-Host "Android VM stopped."
              exit 1
            }

            $rdp = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            if ($null -eq $rdp -or $rdp.Status -ne "Running") {
              Write-Host "RDP service stopped. Attempting restart..."
              try {
                Restart-Service -Name "TermService" -Force
              }
              catch {
                Write-Host "RDP restart failed:"
                Write-Host $_.Exception.Message
              }
            }

            Write-Host "[$(Get-Date)] RDP + Android VM active"
            Start-Sleep -Seconds 300
          }
