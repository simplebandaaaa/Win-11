name: Ubuntu 24.04 XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install XFCE XRDP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xrdp \
            dbus-x11

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser || true
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Configure XFCE session
        run: |
          sudo -u rdpuser bash -c 'printf "%s\n" "xfce4-session" > /home/rdpuser/.xsession'
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod 644 /home/rdpuser/.xsession

          sudo bash -c 'cat > /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r /etc/default/locale ]; then
              . /etc/default/locale
              export LANG LANGUAGE
          fi

          exec /etc/X11/Xsession
          EOF'

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Enable and restart XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo systemctl is-active --quiet xrdp
          echo "XRDP is running"
          sudo ss -lntp | grep ':3389'

      - name: Check Tailscale secret
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY is missing"
            exit 1
          fi
          echo "Tailscale secret found"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show connection details
        run: |
          sleep 3
          echo "================================"
          echo "TAILSCALE IP:"
          sudo tailscale ip -4
          echo "================================"
          echo "RDP USER: rdpuser"
          echo "RDP PASSWORD: Ubuntu@12345"
          echo "RDP PORT: 3389"
          echo "================================"

      - name: Keep runner alive
        run: |
          while true; do
            sleep 60
          done
