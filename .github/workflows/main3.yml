name: Windows RDP + Hyper-V

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==============================
      # 1. CREATE RDP USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $username = "RDP"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Error "MY_RDP_PASSWORD secret is missing."
              exit 1
          }

          if ($password.Length -lt 8) {
              Write-Error "Password must contain at least 8 characters."
              exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP user" `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction Stop

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction Stop

          Write-Host "RDP user created successfully."


      # ==============================
      # 2. ENABLE RDP
      # ==============================
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configured."


      # ==============================
      # 3. ENABLE HYPER-V
      # ==============================
      - name: Enable Hyper-V
        shell: powershell
        run: |
          Write-Host "Enabling Hyper-V..."

          Enable-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All `
            -All `
            -NoRestart

          Write-Host ""
          Write-Host "Hyper-V status:"

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      # ==============================
      # 4. CHECK HYPER-V
      # ==============================
      - name: Check Hyper-V
        shell: powershell
        run: |
          Write-Host "Checking Hyper-V..."

          $feature = Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All

          Write-Host "Feature: $($feature.FeatureName)"
          Write-Host "State:   $($feature.State)"

          Write-Host ""
          Write-Host "Hyper-V commands:"

          Get-Command `
            Get-VM, `
            New-VM, `
            Get-VMSwitch, `
            New-VMSwitch `
            -ErrorAction SilentlyContinue


      # ==============================
      # 5. INSTALL TAILSCALE
      # ==============================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$file`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $file `
            -Force

          Write-Host "Tailscale installed."


      # ==============================
      # 6. CONNECT TAILSCALE
      # ==============================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 1; $i -le 12; $i++) {

              $ip = (& $tailscale ip -4 2>$null |
                Select-Object -First 1).Trim()

              if ($ip) {
                  break
              }

              Write-Host "Waiting for Tailscale IP..."
              Start-Sleep -Seconds 5
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $ip"


      # ==============================
      # 7. TEST RDP
      # ==============================
      - name: Test RDP
        shell: powershell
        run: |
          Write-Host "Testing TCP 3389..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP port is reachable."


      # ==============================
      # 8. DISPLAY CONNECTION INFO
      # ==============================
      - name: Display RDP Information
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP READY"
          Write-Host "======================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "Hyper-V status:"
          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      # ==============================
      # 9. KEEP RUNNER ALIVE
      # ==============================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is active."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
