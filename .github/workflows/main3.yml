name: Windows RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Enable Windows RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP enabled."


      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD not found."
            Write-Host "Generating temporary password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          } else {

            $password = $env:RDP_PASSWORD_SECRET

          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          } else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user created."


      # ==========================================
      # 3. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Tailscale download failed."
          }

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($p.ExitCode)"
          }

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe not found."
          }

          Write-Host "Tailscale installed."


      # ==========================================
      # 4. Start Tailscale Service
      # ==========================================
      - name: Start Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service not found."
          }

          if ($service.Status -ne "Running") {
            Start-Service -Name "Tailscale"
            Start-Sleep -Seconds 5
          }

          Get-Service -Name "Tailscale"


      # ==========================================
      # 5. Connect Tailscale
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting Tailscale..."

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {

            Write-Host "===== TAILSCALE STATUS ====="
            & $ts status

            Write-Host "===== NETCHECK ====="
            & $ts netcheck

            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          Write-Host "===== TAILSCALE STATUS ====="
          & $ts status

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            Write-Host "Getting IPv4: $i/20"

            $output = & $ts ip -4 2>&1

            foreach ($line in $output) {

              $value = $line.ToString().Trim()

              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {

                $tsIP = $value
                break
              }
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$tsIP) {

            Write-Host "===== FINAL STATUS ====="
            & $ts status

            Write-Host "===== NETCHECK ====="
            & $ts netcheck

            throw "Tailscale IP was not assigned."
          }

          Write-Host "Tailscale IP: $tsIP"

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 6. Install QEMU
      # ==========================================
      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu `
            -y `
            --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if (!$qemu) {

            $paths = @(
              "$env:ProgramFiles\qemu\qemu-system-x86_64.exe",
              "$env:ChocolateyInstall\bin\qemu-system-x86_64.exe"
            )

            foreach ($path in $paths) {

              if (Test-Path $path) {

                $qemu = Get-Item $path
                break
              }
            }
          }

          if (!$qemu) {
            throw "QEMU was not found."
          }

          Write-Host "QEMU: $($qemu.Source)"

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 7. Download Android-x86 from OSDN
      # ==========================================
      - name: Download Android Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          $iso = "$dir\android-x86.iso"

          # Android-x86 official 9.0-r2 64-bit image
          # OSDN mirror - no SourceForge
          $url = "https://osdn.net/dl/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"

          Write-Host "Downloading Android-x86 from OSDN..."

          $success = $false

          for ($i = 1; $i -le 3; $i++) {

            try {

              Write-Host "Attempt $i/3"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $iso `
                -UseBasicParsing `
                -TimeoutSec 600

              if (
                (Test-Path $iso) -and
                ((Get-Item $iso).Length -gt 100MB)
              ) {

                $success = $true
                break
              }

            } catch {

              Write-Host "Download failed:"
              Write-Host $_.Exception.Message

              Start-Sleep -Seconds 5
            }
          }

          if (!$success) {

            Write-Host ""
            Write-Host "OSDN download failed."
            Write-Host "Official Android-x86 release: 9.0-r2"

            throw "Android ISO download failed."
          }

          Write-Host "Android ISO downloaded successfully."

          Write-Host "Size:"
          Write-Host ((Get-Item $iso).Length)


      # ==========================================
      # 8. Verify Android ISO
      # ==========================================
      - name: Verify Android Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86.iso"

          $expected = "1cc85b5ed7c830ff71aecf8405c7281a9c995aa0"

          Write-Host "Calculating SHA1..."

          $hash = (
            Get-FileHash `
              -Algorithm SHA1 `
              -Path $iso
          ).Hash.ToLower()

          Write-Host "Expected: $expected"
          Write-Host "Actual  : $hash"

          if ($hash -ne $expected) {
            throw "Android ISO SHA1 verification failed."
          }

          Write-Host "Android ISO verified."


      # ==========================================
      # 9. Create VM Disk
      # ==========================================
      - name: Create Android Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          Write-Host "Creating 16 GB QCOW2 disk..."

          & qemu-img.exe `
            create `
            -f qcow2 `
            "$disk" `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "qemu-img failed."
          }

          if (!(Test-Path $disk)) {
            throw "VM disk was not created."
          }

          Write-Host "VM disk created."


      # ==========================================
      # 10. Start Android VM + VNC
      # ==========================================
      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86.iso"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          $qemu = $env:QEMU_PATH

          if (!(Test-Path $qemu)) {
            throw "QEMU executable not found."
          }

          Write-Host "Starting Android VM..."

          $args = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",

            # Android VM network
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",

            # VNC localhost only
            "-vnc", "127
