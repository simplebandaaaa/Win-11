name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Configure RDP
      # ==========================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "RDP configured successfully."


      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD is not configured."
            Write-Host "Generating temporary password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          } else {

            $password = $env:RDP_PASSWORD_SECRET
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          } else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user created."


      # ==========================================
      # 3. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe was not found."
          }

          Write-Host "Tailscale installed."


      # ==========================================
      # 4. Start Tailscale
      # ==========================================
      - name: Start Tailscale Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service not found."
          }

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name "Tailscale"

            Start-Sleep -Seconds 5
          }

          Get-Service `
            -Name "Tailscale"


      # ==========================================
      # 5. Connect Tailscale
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting Tailscale..."

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {

            Write-Host "Tailscale status:"
            & $ts status

            Write-Host "Tailscale netcheck:"
            & $ts netcheck

            throw "Tailscale connection failed."
          }

          Write-Host "Tailscale connected."

          $tailscaleIP = $null

          for ($i = 1; $i -le 20; $i++) {

            Write-Host "Getting Tailscale IP - attempt $i/20"

            $output = & $ts ip -4 2>$null

            foreach ($line in $output) {

              $value = $line.ToString().Trim()

              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {

                $tailscaleIP = $value

                break
              }
            }

            if ($tailscaleIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$tailscaleIP) {

            Write-Host "===== TAILSCALE STATUS ====="

            & $ts status

            Write-Host "===== NETCHECK ====="

            & $ts netcheck

            throw "Tailscale IPv4 address not available."
          }

          Write-Host "Tailscale IP: $tailscaleIP"

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              -FilePath "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 6. Install QEMU - ROBUST VERSION
      # ==========================================
      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu `
            --yes `
            --no-progress

          Write-Host "Refreshing environment..."

          $machinePath = [Environment]::GetEnvironmentVariable(
            "Path",
            "Machine"
          )

          $userPath = [Environment]::GetEnvironmentVariable(
            "Path",
            "User"
          )

          $env:Path = "$machinePath;$userPath"

          Write-Host "Searching for QEMU..."

          $possiblePaths = @(
            "C:\Program Files\qemu\qemu-system-x86_64.exe",
            "C:\Program Files\QEMU\qemu-system-x86_64.exe",
            "C:\ProgramData\chocolatey\bin\qemu-system-x86_64.exe",
            "$env:ChocolateyInstall\bin\qemu-system-x86_64.exe"
          )

          $qemuPath = $null

          foreach ($path in $possiblePaths) {

            Write-Host "Checking: $path"

            if (Test-Path $path) {

              $qemuPath = $path

              break
            }
          }

          if (!$qemuPath) {

            Write-Host "Searching entire Program Files..."

            $found = Get-ChildItem `
              -Path "C:\Program Files" `
              -Filter "qemu-system-x86_64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $qemuPath = $found.FullName
            }
          }

          if (!$qemuPath) {

            Write-Host "===== QEMU DEBUG ====="

            choco list --local-only qemu

            Write-Host ""
            Write-Host "PATH:"
            Write-Host $env:Path

            throw "QEMU executable could not be found."
          }

          Write-Host ""
          Write-Host "QEMU FOUND:"
          Write-Host $qemuPath

          & $qemuPath --version

          if ($LASTEXITCODE -ne 0) {
            throw "QEMU executable cannot run."
          }

          "QEMU_PATH=$qemuPath" |
            Out-File `
              -FilePath "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 7. Download Android ISO
      # ==========================================
      - name: Download Android ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $androidDir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $androidDir `
            -Force |
            Out-Null

          $iso = "$androidDir\android.iso"

          $url = "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          Write-Host "Android ISO URL:"
          Write-Host $url

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {

            Write-Host ""
            Write-Host "Download attempt $attempt/3"

            try {

              if (Test-Path $iso) {
                Remove-Item $iso -Force
              }

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $iso `
                -UseBasicParsing `
                -MaximumRedirection 20 `
                -TimeoutSec 900

              if (Test-Path $iso) {

                $size = (Get-Item $iso).Length

                Write-Host "Downloaded size: $size bytes"

                # Real ISO is hundreds of MB.
                # Small files are usually SourceForge HTML/redirect pages.
                if ($size -gt 500MB) {

                  $success = $true

                  break

                } else {

                  Write-Host "File is too small; not a real ISO."

                  Remove-Item `
                    $iso `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
              }

            }
            catch {

              Write-Host "Download error:"
              Write-Host $_.Exception.Message
            }

            Start-Sleep -Seconds 5
          }

          if (!$success) {
            throw "Android ISO download failed. SourceForge returned a small redirect/page instead of the ISO."
          }

          Write-Host "Android ISO downloaded successfully."


      # ==========================================
      # 8. Create Android Disk
      # ==========================================
      - name: Create Android VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          Write-Host "Creating 16 GB QCOW2 disk..."

          & qemu-img.exe `
            create `
            -f qcow2 `
            "$disk" `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "qemu-img failed."
          }

          if (!(Test-Path $disk)) {
            throw "Android VM disk was not created."
          }

          Write-Host "Android disk created."


      # ==========================================
      # 9. Start Android VM
      # ==========================================
      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qemu = $env:QEMU_PATH

          $iso = "$env:GITHUB_WORKSPACE\android\android.iso"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          if ([string]::IsNullOrWhiteSpace($qemu)) {
            throw "QEMU_PATH is empty."
          }

          if (!(Test-Path $qemu)) {
            throw "QEMU executable not found: $qemu"
          }

          if (!(Test-Path $iso)) {
            throw "Android ISO not found."
          }

          if (!(Test-Path $disk)) {
            throw "Android disk not found."
          }

          Write-Host "Starting Android VM..."

          $arguments = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-device", "usb-tablet",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-vnc", "127.0.0.1:1"
          )

          $vm = Start-Process `
            -FilePath $qemu `
            -ArgumentList $arguments `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {

            throw "QEMU exited immediately. Exit code: $($vm.ExitCode)"
          }

          Write-Host ""
          Write-Host "Android VM started successfully."
          Write-Host "QEMU PID: $($vm.Id)"
          Write-Host "VNC: 127.0.0.1:5901"


      # ==========================================
      # 10. Verify RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP service..."

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {

            Restart-Service `
              -Name "TermService" `
              -Force

            Start-Sleep -Seconds 5
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$test.TcpTestSucceeded) {
            throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP is ready."


      # ==========================================
      # 11. Show Connection Details
      # ==========================================
      - name: Show Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP CONNECTION"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              ANDROID VM"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "RAM  : 2048 MB"
          Write-Host "CPU  : 2 cores"
          Write-Host "Disk : 16 GB"
          Write-Host "VNC  : 127.0.0.1:5901"
          Write-Host ""
          Write-Host "=========================================="


      # ==========================================
      # 12. Keep Alive
      # ==========================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {

            $qemu = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if (!$qemu) {

              Write-Host "Android VM stopped."

              exit 1
            }

            $rdp = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            if ($null -eq $rdp -or $rdp.Status -ne "Running") {

              Write-Host "RDP service stopped. Restarting..."

              Restart-Service `
                -Name "TermService" `
                -Force
            }

            Write-Host "[$(Get-Date)] RDP + Android VM active"

            Start-Sleep -Seconds 300
          }
