name: Windows RDP + Android x86 VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "RDP configured."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {
            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )
          }
          else {
            $password = $env:RDP_PASSWORD_SECRET
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user ready."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing `
            -TimeoutSec 300

          if (!(Test-Path $installer)) {
            throw "Tailscale download failed."
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe not found."
          }

          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting to Tailscale..."

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            & $ts status
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {
            $output = & $ts ip -4 2>$null

            foreach ($line in $output) {
              $candidate = $line.ToString().Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $candidate
                break
              }
            }

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$ip) {
            & $ts status
            throw "Tailscale IPv4 was not assigned."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $ip"

      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu --yes --no-progress

          $qemu = $null

          $possible = @(
            "C:\Program Files\qemu\qemu-system-x86_64.exe",
            "C:\Program Files\QEMU\qemu-system-x86_64.exe"
          )

          foreach ($path in $possible) {
            if (Test-Path $path) {
              $qemu = $path
              break
            }
          }

          if (!$qemu) {
            $found = Get-ChildItem `
              -Path "C:\Program Files" `
              -Filter "qemu-system-x86_64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $qemu = $found.FullName
            }
          }

          if (!$qemu) {
            throw "QEMU was not found after installation."
          }

          & $qemu --version

          "QEMU_PATH=$qemu" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "QEMU ready."

      - name: Download Android K49 ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          $iso = "$dir\android-x86_64-9.0-r2-k49.iso"

          $url = "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2-k49.iso/download"

          Write-Host "Downloading Android-x86 K49 ISO..."
          Write-Host "Expected size: about 963 MB"

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Download attempt $attempt/3"

            Remove-Item `
              $iso `
              -Force `
              -ErrorAction SilentlyContinue

            try {
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $iso `
                -UseBasicParsing `
                -TimeoutSec 1800

              if (Test-Path $iso) {
                $size = (Get-Item $iso).Length

                Write-Host "Downloaded size: $size bytes"

                if ($size -gt 800MB) {
                  $success = $true
                  break
                }

                Write-Host "File is too small."
              }
            }
            catch {
              Write-Host "Download attempt failed."
              Write-Host $_.Exception.Message
            }

            Start-Sleep -Seconds 5
          }

          if (!$success) {
            throw "Android K49 ISO download failed."
          }

          Write-Host "Verifying SHA1..."

          $hash = (
            Get-FileHash `
              -Path $iso `
              -Algorithm SHA1
          ).Hash.ToLower()

          $expected = "9975ee08cd2420f11101e3acb102930dd07e5e5f"

          Write-Host "Actual SHA1:"
          Write-Host $hash

          if ($hash -ne $expected) {
            Remove-Item $iso -Force
            throw "SHA1 verification failed."
          }

          Write-Host "ANDROID K49 ISO VERIFIED."

      - name: Create VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qemuDir = Split-Path `
            $env:QEMU_PATH `
            -Parent

          $qimg = Join-Path `
            $qemuDir `
            "qemu-img.exe"

          if (!(Test-Path $qimg)) {
            throw "qemu-img.exe was not found."
          }

          "QEMU_IMG=$qimg" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          Write-Host "Creating 16 GB QCOW2 disk..."

          & $qimg `
            create `
            -f qcow2 `
            $disk `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "QCOW2 creation failed."
          }

          Write-Host "VM disk created."

      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qemu = $env:QEMU_PATH

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86_64-9.0-r2-k49.iso"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          if (!(Test-Path $qemu)) {
            throw "QEMU executable not found."
          }

          if (!(Test-Path $iso)) {
            throw "Android ISO not found."
          }

          if (!(Test-Path $disk)) {
            throw "Android disk not found."
          }

          Write-Host "Starting Android VM..."

          $args = @(
            "-name", "Android-x86",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-device", "usb-tablet",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-vnc", "127.0.0.1:1"
          )

          $vm = Start-Process `
            -FilePath $qemu `
            -ArgumentList $args `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {
            throw "Android VM exited. Exit code: $($vm.ExitCode)"
          }

          Write-Host "Android VM started."
          Write-Host "QEMU PID: $($vm.Id)"
          Write-Host "VNC: 127.0.0.1:5901"

      - name: Show Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP READY"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Android VM:"
          Write-Host "RAM : 2048 MB"
          Write-Host "CPU : 2"
          Write-Host "Disk: 16 GB"
          Write-Host "=========================================="

      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          while ($true) {
            $vm = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if (!$vm) {
              Write-Host "Android VM stopped."
              exit 1
            }

            Write-Host "[$(Get-Date)] RDP + Android VM running."

            Start-Sleep -Seconds 300
          }
