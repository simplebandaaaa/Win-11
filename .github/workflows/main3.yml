name: Fast Ubuntu XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install XFCE + XRDP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 \
            xrdp \
            dbus-x11

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd

      - name: Configure XFCE
        run: |
          echo 'startxfce4' | sudo tee /home/rdpuser/.xsession >/dev/null
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Start XRDP
        run: |
          sudo systemctl enable --now xrdp
          sudo ss -lntp | grep ':3389'

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show RDP information
        run: |
          sleep 3
          echo "=============================="
          echo "TAILSCALE IP:"
          sudo tailscale ip -4
          echo "=============================="
          echo "USERNAME: rdpuser"
          echo "PASSWORD: Ubuntu@12345"
          echo "PORT: 3389"
          echo "=============================="

      - name: Keep alive
        run: |
          while true; do sleep 60; done
