name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Configure Windows RDP
      # ==========================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "RDP configured successfully."


      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD not configured."
            Write-Host "Generating temporary password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          }
          else {
            $password = $env:RDP_PASSWORD_SECRET
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          }
          else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user configured."


      # ==========================================
      # 3. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed. Exit code: $($p.ExitCode)"
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe not found."
          }

          Write-Host "Tailscale installed successfully."


      # ==========================================
      # 4. Start Tailscale
      # ==========================================
      - name: Start Tailscale Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service not found."
          }

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name "Tailscale"

            Start-Sleep -Seconds 5
          }

          Write-Host "Tailscale service:"
          Get-Service -Name "Tailscale"


      # ==========================================
      # 5. Connect Tailscale
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting to Tailscale..."

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {

            Write-Host "Tailscale connection failed."

            & $ts status
            & $ts netcheck

            throw "tailscale up failed."
          }

          Write-Host "Tailscale status:"
          & $ts status

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            Write-Host "Getting Tailscale IP - attempt $i/20"

            $output = & $ts ip -4 2>&1

            foreach ($line in $output) {

              $value = $line.ToString().Trim()

              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {

                $tsIP = $value
                break
              }
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$tsIP) {

            Write-Host "Final Tailscale status:"
            & $ts status

            Write-Host "Tailscale netcheck:"
            & $ts netcheck

            throw "Tailscale IPv4 address was not assigned."
          }

          Write-Host "Tailscale IP: $tsIP"

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 6. Install QEMU
      # ==========================================
      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu `
            -y `
            --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $qemu) {

            $paths = @(
              "$env:ProgramFiles\qemu\qemu-system-x86_64.exe",
              "$env:ChocolateyInstall\bin\qemu-system-x86_64.exe"
            )

            foreach ($path in $paths) {

              if (Test-Path $path) {
                $qemu = Get-Item $path
                break
              }
            }
          }

          if ($null -eq $qemu) {
            throw "QEMU executable not found."
          }

          Write-Host "QEMU found:"
          Write-Host $qemu.Source

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 7. Download Android-x86
      # ==========================================
      - name: Download Android-x86
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $androidDir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $androidDir `
            -Force |
            Out-Null

          $iso = "$androidDir\android-x86_64-9.0-r2.iso"

          # Official Android-x86 9.0-r2 file
          $sourceForge = `
            "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          # Public mirror
          $mirror = `
            "https://mirrors.dotsrc.org/osdn/android-x86/71931/android-x86_64-9.0-r2.iso"

          # Official SHA-1 from Android-x86 release page
          $expectedSha1 = `
            "1cc85b5ed7c830ff71aecf8405c7281a9c995aa0"

          $urls = @(
            $sourceForge,
            $mirror
          )

          $success = $false

          foreach ($url in $urls) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "Trying:"
            Write-Host $url
            Write-Host "=========================================="

            for ($attempt = 1; $attempt -le 2; $attempt++) {

              Write-Host "Attempt $attempt/2"

              try {

                if (Test-Path $iso) {
                  Remove-Item `
                    $iso `
                    -Force
                }

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $iso `
                  -UseBasicParsing `
                  -TimeoutSec 900 `
                  -Headers @{
                    "User-Agent" = "Mozilla/5.0"
                  }

                if (!(Test-Path $iso)) {
                  throw "ISO file was not created."
                }

                $size = (Get-Item $iso).Length

                Write-Host "Downloaded bytes: $size"

                if ($size -lt 850MB) {
                  throw "Downloaded file is too small."
                }

                Write-Host "Calculating SHA-1..."

                $hash = (
                  Get-FileHash `
                    -Path $iso `
                    -Algorithm SHA1
                ).Hash.ToLower()

                Write-Host "SHA-1:"
                Write-Host $hash

                if ($hash -ne $expectedSha1) {

                  throw `
                    "SHA-1 mismatch. Expected $expectedSha1 but received $hash"
                }

                Write-Host ""
                Write-Host "Android-x86 ISO verified successfully."

                $success = $true

                break

              }
              catch {

                Write-Host ""
                Write-Host "Download/verification failed:"
                Write-Host $_.Exception.Message

                if ($attempt -lt 2) {
                  Start-Sleep -Seconds 10
                }
              }
            }

            if ($success) {
              break
            }
          }

          if (!$success) {

            throw `
              "Android-x86 ISO could not be downloaded and verified."
          }

          "ANDROID_ISO=$iso" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 8. Create VM Disk
      # ==========================================
      - name: Create Android VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          Write-Host "Creating 16 GB Android disk..."

          & qemu-img.exe `
            create `
            -f qcow2 `
            "$disk" `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "qemu-img failed."
          }

          if (!(Test-Path $disk)) {
            throw "Android disk was not created."
          }

          "ANDROID_DISK=$disk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "VM disk created."


      # ==========================================
      # 9. Start Android VM
      # ==========================================
      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qemu = $env:QEMU_PATH
          $iso = $env:ANDROID_ISO
          $disk = $env:ANDROID_DISK

          if (!(Test-Path $qemu)) {
            throw "QEMU not found."
          }

          if (!(Test-Path $iso)) {
            throw "Android ISO not found."
          }

          if (!(Test-Path $disk)) {
            throw "Android VM disk not found."
          }

          Write-Host "Starting Android VM..."

          $args = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-vnc", "127.0.0.1:1"
          )

          $vm = Start-Process `
            -FilePath $qemu `
            -ArgumentList $args `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {

            Write-Host "QEMU exited."
            Write-Host "Exit code: $($vm.ExitCode)"

            throw "Android VM failed to start."
          }

          Write-Host "Android VM started."
          Write-Host "QEMU PID: $($vm.Id)"

          "QEMU_PID=$($vm.Id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================
      # 10. Verify RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name "TermService"

          Write-Host "RDP service: $($service.Status)"

          if ($service.Status -ne "Running") {

            Restart-Service `
              -Name "TermService" `
              -Force

            Start-Sleep -Seconds 5
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$test.TcpTestSucceeded) {
            throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP port 3389 is active."


      # ==========================================
      # 11. Show Connection Details
      # ==========================================
      - name: Show Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "               RDP CONNECTION"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "               ANDROID VM"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Android-x86 9.0-r2"
          Write-Host "RAM : 2048 MB"
          Write-Host "CPU : 2 cores"
          Write-Host "Disk: 16 GB"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""


      # ==========================================
      # 12. Keep Runner Alive
      # ==========================================
      - name: Keep RDP And Android Alive
        shell: powershell
        run: |
          Write-Host "RDP + Android VM is active."

          while ($true) {

            $qemu = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if ($null -eq $qemu) {

              Write-Host "Android VM stopped."

              exit 1
            }

            $rdp = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $rdp -or
              $rdp.Status -ne "Running"
            ) {

              Write-Host "RDP service stopped."

              try {

                Restart-Service `
                  -Name "TermService" `
                  -Force

              }
              catch {

                Write-Host "Unable to restart RDP service."
              }
            }

            Write-Host "[$(Get-Date)] RDP + Android VM active"

            Start-Sleep -Seconds 300
          }
