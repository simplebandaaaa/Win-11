name: Ubuntu 24.04 XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Install XFCE and XRDP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 \
            xrdp \
            dbus-x11

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd

      - name: Configure XFCE
        run: |
          echo 'startxfce4' | sudo tee /home/rdpuser/.xsession >/dev/null
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      - name: Start XRDP
        run: |
          sudo systemctl enable --now xrdp
          sleep 2
          sudo systemctl --no-pager status xrdp
          sudo ss -lntp | grep ':3389'

      - name: Check Tailscale Secret
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY is missing!"
            echo "Go to GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "TAILSCALE_AUTHKEY found."

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Get Tailscale IP
        run: |
          sleep 3

          echo ""
          echo "======================================"
          echo "       TAILSCALE / RDP DETAILS"
          echo "======================================"
          echo ""
          echo "Tailscale IPv4:"
          sudo tailscale ip -4
          echo ""
          echo "RDP Username: rdpuser"
          echo "RDP Password: Ubuntu@12345"
          echo "RDP Port: 3389"
          echo ""
          echo "======================================"

      - name: Verify RDP
        run: |
          echo "Checking XRDP..."
          sudo ss -lntp | grep ':3389' || exit 1
          echo "XRDP is listening on port 3389."

      - name: Keep runner alive
        run: |
          echo "RDP server is running..."
          while true; do
            sleep 60
          done
