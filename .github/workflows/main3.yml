name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # =========================================
      # 1. Configure Windows RDP
      # =========================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

          Write-Host "RDP enabled."


      # =========================================
      # 2. Create RDP User
      # =========================================
      - name: Create RDP User
        shell: powershell
        env:
          PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PASSWORD)) {

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          } else {

            $password = $env:PASSWORD

          }

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $secure `
              -AccountNeverExpires `
              -PasswordNeverExpires

          } else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user ready."


      # =========================================
      # 3. Install Tailscale
      # =========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file `
            -UseBasicParsing

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($p.ExitCode)"
          }

          Remove-Item $file -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe not found."
          }

          Write-Host "Tailscale installed."


      # =========================================
      # 4. Connect Tailscale
      # =========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {

            & $ts status
            & $ts netcheck

            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {

            $output = & $ts ip -4 2>$null

            foreach ($line in $output) {

              $v = $line.ToString().Trim()

              if ($v -match '^\d{1,3}(\.\d{1,3}){3}$') {

                $ip = $v
                break
              }
            }

            if ($ip) {
              break
            }

            Start-Sleep 3
          }

          if (!$ip) {

            & $ts status
            & $ts netcheck

            throw "Tailscale IPv4 not available."
          }

          Write-Host "Tailscale IP: $ip"

          "TAILSCALE_IP=$ip" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append


      # =========================================
      # 5. Install QEMU
      # =========================================
      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install qemu -y --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if (!$qemu) {
            throw "QEMU was not found."
          }

          Write-Host "QEMU: $($qemu.Source)"

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append


      # =========================================
      # 6. Download Android ISO correctly
      # =========================================
      - name: Download Android ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          $iso = "$dir\android.iso"

          $page = "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/"

          Write-Host "Getting SourceForge file page..."

          $html = Invoke-WebRequest `
            -Uri $page `
            -UseBasicParsing `
            -MaximumRedirection 10

          $match = [regex]::Match(
            $html.Content,
            'href="([^"]*android-x86_64-9\.0-r2\.iso[^"]*)"'
          )

          if (!$match.Success) {

            Write-Host "Could not resolve SourceForge file URL."

            Write-Host "Trying direct SourceForge download endpoint..."

            $downloadUrl =
              "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          } else {

            $downloadUrl = $match.Groups[1].Value

            if ($downloadUrl.StartsWith("/")) {
              $downloadUrl = "https://sourceforge.net$downloadUrl"
            }
          }

          Write-Host "Resolved URL:"
          Write-Host $downloadUrl

          $success = $false

          for ($i = 1; $i -le 3; $i++) {

            Write-Host ""
            Write-Host "Download attempt $i/3"

            try {

              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $iso `
                -UseBasicParsing `
                -MaximumRedirection 20 `
                -TimeoutSec 900

              $size = (Get-Item $iso).Length

              Write-Host "Downloaded size: $size bytes"

              # Android ISO must be much larger than the
              # ~140 KB HTML redirect page.
              if ($size -gt 500MB) {

                $success = $true
                break

              } else {

                Write-Host "Downloaded file is too small."
                Remove-Item $iso -Force -ErrorAction SilentlyContinue
              }

            }
            catch {

              Write-Host "Download error:"
              Write-Host $_.Exception.Message
            }

            Start-Sleep -Seconds 5
          }

          if (!$success) {
            throw "A real Android ISO could not be downloaded. SourceForge returned a redirect/page instead of the ISO."
          }

          Write-Host ""
          Write-Host "Android ISO downloaded successfully."
          Write-Host "Size: $((Get-Item $iso).Length) bytes"


      # =========================================
      # 7. Create VM Disk
      # =========================================
      - name: Create Android Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          qemu-img.exe create `
            -f qcow2 `
            "$disk" `
            16G

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create VM disk."
          }

          Write-Host "16 GB disk created."


      # =========================================
      # 8. Start Android VM
      # =========================================
      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:GITHUB_WORKSPACE\android\android.iso"

          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          $qemu = $env:QEMU_PATH

          if (!(Test-Path $iso)) {
            throw "Android ISO missing."
          }

          if (!(Test-Path $disk)) {
            throw "Android disk missing."
          }

          $args = @(
            "-name", "AndroidVM",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-device", "usb-tablet",
            "-netdev", "user,id=n1",
            "-device", "e1000,netdev=n1",
            "-vnc", "127.0.0.1:1"
          )

          Write-Host "Starting Android VM..."

          $vm = Start-Process `
            -FilePath $qemu `
            -ArgumentList $args `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {
            throw "QEMU exited. Exit code: $($vm.ExitCode)"
          }

          Write-Host "Android VM running."
          Write-Host "QEMU PID: $($vm.Id)"


      # =========================================
      # 9. Verify RDP
      # =========================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (!$test.TcpTestSucceeded) {
            throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP is ready."


      # =========================================
      # 10. Show Details
      # =========================================
      - name: Show Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP DETAILS"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             ANDROID VM"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "QEMU RAM : 2048 MB"
          Write-Host "QEMU CPU : 2 cores"
          Write-Host "VM Disk  : 16 GB"
          Write-Host "VNC      : localhost:5901"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""


      # =========================================
      # 11. Keep Alive
      # =========================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {

            $qemu = Get-Process `
              -Name "qemu-system-x86_64" `
              -ErrorAction SilentlyContinue

            if (!$qemu) {

              Write-Host "Android VM stopped."

              exit 1
            }

            Write-Host "[$(Get-Date)] RDP + Android VM running"

            Start-Sleep -Seconds 300
          }
