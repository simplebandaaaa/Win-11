name: RDP AVM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force


      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"
          $password = "MyRdp@2026!"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          "RDP_PASSWORD=$password" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "RDP user created."


      - name: Install Hyper-V
        shell: powershell
        run: |
          Write-Host "Installing Hyper-V..."

          Enable-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All `
            -All `
            -NoRestart

          Write-Host "Hyper-V installation command completed."

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      - name: Check Hyper-V
        shell: powershell
        run: |
          Write-Host "Checking Hyper-V..."

          Get-Command `
            Get-VM, `
            New-VM, `
            Get-VMSwitch `
            -ErrorAction SilentlyContinue

          Write-Host "Hyper-V check completed."


      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force


      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 1; $i -le 12; $i++) {

              $ip = (& $tailscale ip -4 2>$null |
                Select-Object -First 1).Trim()

              if ($ip) {
                  break
              }

              Write-Host "Waiting for Tailscale..."
              Start-Sleep -Seconds 5
          }

          if (-not $ip) {
              Write-Error "Tailscale IP not found."
              exit 1
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      - name: Test RDP
        shell: powershell
        run: |
          Write-Host "Testing RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP connection test successful."


      - name: RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP READY"
          Write-Host "======================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "Hyper-V:"
          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName, State


      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is running."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
