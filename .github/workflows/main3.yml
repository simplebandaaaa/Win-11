name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==============================
      # 1. Enable Windows RDP
      # ==============================
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          netsh advfirewall firewall add rule `
            name="RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force


      # ==============================
      # 2. Create RDP User
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "MY_RDP_PASSWORD GitHub Secret is required."
            exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if (-not $existing) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$env:RDP_PASSWORD" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==============================
      # 3. Install Tailscale
      # ==============================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force


      # ==============================
      # 4. Connect Tailscale
      # ==============================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "TAILSCALE_AUTH_KEY GitHub Secret is required."
            exit 1
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="gh-android-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          $tsIP = & $ts ip -4 |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            Write-Error "Tailscale IPv4 address was not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==============================
      # 5. Install QEMU
      # ==============================
      - name: Install QEMU
        shell: powershell
        run: |
          choco install qemu -y --no-progress

          $qemu = Get-Command qemu-system-x86_64.exe `
            -ErrorAction SilentlyContinue

          if (-not $qemu) {
            Write-Error "QEMU installation failed."
            exit 1
          }

          Write-Host "QEMU installed:"
          Write-Host $qemu.Source


      # ==============================
      # 6. Download Android-x86 ISO
      # ==============================
      - name: Download Android ISO
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\android" |
            Out-Null

          $iso = "$env:GITHUB_WORKSPACE\android\android-x86.iso"

          $url = "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"

          Write-Host "Downloading Android-x86..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $iso

          if (-not (Test-Path $iso)) {
            Write-Error "Android ISO download failed."
            exit 1
          }

          Write-Host "Android ISO downloaded."


      # ==============================
      # 7. Create Android VM Disk
      # ==============================
      - name: Create Android VM Disk
        shell: powershell
        run: |
          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          qemu-img create `
            -f qcow2 `
            $disk `
            16G

          if (-not (Test-Path $disk)) {
            Write-Error "VM disk creation failed."
            exit 1
          }

          Write-Host "Android VM disk created."


      # ==============================
      # 8. Start Android VM
      # ==============================
      - name: Start Android VM
        shell: powershell
        run: |
          $iso  = "$env:GITHUB_WORKSPACE\android\android-x86.iso"
          $disk = "$env:GITHUB_WORKSPACE\android\android.qcow2"

          $qemu = (Get-Command qemu-system-x86_64.exe).Source

          Write-Host "Starting Android VM..."

          Start-Process `
            -FilePath $qemu `
            -ArgumentList @(
              "-m", "2048",
              "-smp", "2",
              "-machine", "q35",
              "-cpu", "max",
              "-drive", "file=$disk,format=qcow2",
              "-cdrom", $iso,
              "-boot", "d",
              "-vga", "std",
              "-display", "none",
              "-serial", "none",
              "-monitor", "none",
              "-netdev", "user,id=n1",
              "-device", "e1000,netdev=n1"
            ) `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          $process = Get-Process `
            -Name "qemu-system-x86_64" `
            -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "Android VM failed to start."
            exit 1
          }

          Write-Host "Android VM is running."


      # ==============================
      # 9. Verify RDP
      # ==============================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP port 3389 is not reachable."
            exit 1
          }

          Write-Host "RDP is reachable."


      # ==============================
      # 10. Show Connection Details
      # ==============================
      - name: Show RDP Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP + ANDROID VM"
          Write-Host "========================================"
          Write-Host "RDP Address : $env:TAILSCALE_IP"
          Write-Host "Username    : RDP"
          Write-Host "Password    : [GitHub Secret]"
          Write-Host ""
          Write-Host "Android
