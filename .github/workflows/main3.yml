name: RDP + Android VM

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. Enable RDP
      # ==========================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null

          netsh advfirewall firewall add rule `
            name="GitHub-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP configured successfully."


      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.MY_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_SECRET)) {

            Write-Host "MY_RDP_PASSWORD is not configured."
            Write-Host "Generating temporary RDP password..."

            $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

            $password = -join (
              1..18 | ForEach-Object {
                $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
            )

          } else {

            $password = $env:RDP_PASSWORD_SECRET

          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          } else {

            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "RDP user configured."


      # ==========================================
      # 3. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Tailscale installer was not downloaded."
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed. Exit code: $($process.ExitCode)"
          }

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "tailscale.exe was not found after installation."
          }

          Write-Host "Tailscale installed successfully."


      # ==========================================
      # 4. Connect Tailscale
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting to Tailscale..."

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-android-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed. Exit code: $LASTEXITCODE"
          }

          Start-Sleep -Seconds 5

          $tsIP =
