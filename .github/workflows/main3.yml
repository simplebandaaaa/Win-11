name: Android x86 VM Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-vm:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:

      - name: Install QEMU
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing QEMU..."

          choco install qemu --yes --no-progress

          $qemu = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "qemu-system-x86_64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qemu) {
            throw "QEMU was not found after installation."
          }

          Write-Host "QEMU: $($qemu.FullName)"

          & $qemu.FullName --version

          "QEMU_PATH=$($qemu.FullName)" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

      - name: Download Android-x86 ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = "$env:GITHUB_WORKSPACE\android"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          $iso = "$dir\android-x86_64-9.0-r2.iso"

          $url = "https://ftp.jaist.ac.jp/pub/osdn.net/android-x86/71931/android-x86_64-9.0-r2.iso"

          Write-Host "Downloading Android-x86..."
          Write-Host $url

          $client = New-Object `
            System.Net.WebClient

          $client.DownloadFile(
            $url,
            $iso
          )

          if (-not (Test-Path $iso)) {
            throw "Android ISO was not downloaded."
          }

          $size = (
            Get-Item $iso
          ).Length

          Write-Host "Downloaded: $size bytes"

          if ($size -lt 800MB) {
            Remove-Item $iso -Force
            throw "Downloaded file is too small."
          }

          Write-Host "Checking SHA1..."

          $hash = (
            Get-FileHash `
              $iso `
              -Algorithm SHA1
          ).Hash.ToLower()

          Write-Host "SHA1: $hash"

          $expected = `
            "1cc85b5ed7c830ff71aecf8405c7281a9c995aa0"

          if ($hash -ne $expected) {
            Remove-Item $iso -Force
            throw "Android ISO SHA1 verification failed."
          }

          Write-Host "Android ISO verified."

      - name: Find QEMU Image Tool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $qimg = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "qemu-img.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $qimg) {
            throw "qemu-img.exe was not found."
          }

          Write-Host "qemu-img: $($qimg.FullName)"

          "QEMU_IMG=$($qimg.FullName)" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8 `
              -Append

      - name: Create VM Disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $disk = `
            "$env:GITHUB_WORKSPACE\android\android.qcow2"

          & $env:QEMU_IMG `
            create `
            -f qcow2 `
            $disk `
            8G

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Android VM disk."
          }

          if (-not (Test-Path $disk)) {
            throw "VM disk was not created."
          }

          Write-Host "VM disk created."

      - name: Start Android VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = `
            "$env:GITHUB_WORKSPACE\android\android-x86_64-9.0-r2.iso"

          $disk = `
            "$env:GITHUB_WORKSPACE\android\android.qcow2"

          if (-not (Test-Path $iso)) {
            throw "Android ISO not found."
          }

          if (-not (Test-Path $disk)) {
            throw "Android VM disk not found."
          }

          $args = @(
            "-name", "Android-x86",
            "-m", "2048",
            "-smp", "2",
            "-machine", "q35",
            "-cpu", "max",
            "-drive", "file=$disk,format=qcow2",
            "-cdrom", $iso,
            "-boot", "d",
            "-vga", "std",
            "-display", "none",
            "-netdev", "user,id=net0",
            "-device", "e1000,netdev=net0",
            "-monitor", "stdio"
          )

          Write-Host "Starting Android VM..."

          $vm = Start-Process `
            -FilePath $env:QEMU_PATH `
            -ArgumentList $args `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 15

          if ($vm.HasExited) {
            throw "QEMU exited with code $($vm.ExitCode)."
          }

          Write-Host "Android VM started."
          Write-Host "PID: $($vm.Id)"

      - name: Verify VM
        shell: powershell
        run: |
          $vm = Get-Process `
            -Name "qemu-system-x86_64" `
            -ErrorAction SilentlyContinue

          if (-not $vm) {
            throw "Android VM is not running."
          }

          Write-Host "Android VM is running successfully."

      - name: Stop VM
        if: always()
        shell: powershell
        run: |
          Get-Process `
            -Name "qemu-system-x86_64" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "QEMU stopped."
