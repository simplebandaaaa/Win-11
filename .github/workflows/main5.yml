name: RDP + MEmu Play

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # 1. RDP CONFIGURATION
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CONFIGURING WINDOWS RDP"
          Write-Host "============================================================"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Start-Sleep -Seconds 3

          Write-Host "RDP configuration complete."


      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CREATING RDP USER"
          Write-Host "============================================================"

          $password = "${{ secrets.MY_RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
              $password = "SecurePass@2026!"
              Write-Host "MY_RDP_PASSWORD secret not found."
              Write-Host "Using fallback password."
          }

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "RDP user already exists."

              Set-LocalUser `
                -Name "RDP" `
                -Password $securePass

          } else {

              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              throw "RDP user creation failed."
          }

          Write-Host "RDP user ready."


      # ============================================================
      # 3. WINDOWS PERFORMANCE
      # ============================================================
      - name: Optimize Windows For MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " WINDOWS PERFORMANCE OPTIMIZATION"
          Write-Host "============================================================"

          # High Performance power plan
          powercfg /setactive SCHEME_MIN 2>$null

          # Disable visual effects
          reg add `
            "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            /v VisualFXSetting `
            /t REG_DWORD `
            /d 2 `
            /f | Out-Null

          # Disable transparency
          reg add `
            "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            /v EnableTransparency `
            /t REG_DWORD `
            /d 0 `
            /f | Out-Null

          # RDP performance
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableWallpaper `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableFullWindowDrag `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableMenuAnims `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableThemes `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          Write-Host "Windows optimized."


      # ============================================================
      # 4. DOWNLOAD MEMU
      # ============================================================
      - name: Download MEmu Play
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " DOWNLOADING MEMU PLAY"
          Write-Host "============================================================"

          $installer = "$env:TEMP\MEmu-Setup.exe"

          # Official MEmu endpoint
          $urls = @(
              "https://www.memuplay.com/download.php?file_name=Memu-Setup&from=official_release",
              "https://www.memuplay.com/download.php?file_name=Memu-Setup&from=home_en",
              "https://www.memuplay.com/download.php?file_name=Memu-Setup"
          )

          $downloaded = $false

          foreach ($url in $urls) {

              Write-Host ""
              Write-Host "Trying:"
              Write-Host $url

              try {

                  Remove-Item `
                    $installer `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Invoke-WebRequest `
                    -Uri $url `
                    -OutFile $installer `
                    -UseBasicParsing `
                    -MaximumRedirection 20 `
                    -Headers @{
                        "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
                        "Accept" = "*/*"
                    }

                  if (Test-Path $installer) {

                      $size = (Get-Item $installer).Length

                      Write-Host "Downloaded size: $size bytes"

                      if ($size -gt 1000000) {

                          $fs = [System.IO.File]::OpenRead($installer)

                          try {

                              $b1 = $fs.ReadByte()
                              $b2 = $fs.ReadByte()

                          } finally {

                              $fs.Dispose()
                          }

                          if ($b1 -eq 0x4D -and $b2 -eq 0x5A) {

                              Write-Host "Valid Windows EXE detected."

                              $downloaded = $true
                              break
                          }
                      }
                  }

                  Write-Host "Downloaded file was not a valid installer."

              }
              catch {

                  Write-Host "Download attempt failed:"
                  Write-Host $_.Exception.Message
              }
          }

          if (-not $downloaded) {

              Write-Host ""
              Write-Host "============================================================"
              Write-Host " MEMU DOWNLOAD FAILED"
              Write-Host "============================================================"

              if (Test-Path $installer) {

                  Write-Host "Downloaded file information:"
                  Get-Item $installer | Format-List *

                  Write-Host ""
                  Write-Host "First 300 characters:"
                  Get-Content `
                    $installer `
                    -Raw `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1
              }

              throw "Unable to download a valid MEmu installer from official MEmu endpoints."
          }

          Write-Host ""
          Write-Host "MEmu installer downloaded successfully."

          "MEMU_INSTALLER=$installer" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 5. INSTALL MEMU
      # ============================================================
      - name: Install MEmu Play
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " INSTALLING MEMU PLAY"
          Write-Host "============================================================"

          $installer = $env:MEMU_INSTALLER

          if (-not (Test-Path $installer)) {
              throw "MEmu installer not found."
          }

          Write-Host "Installer:"
          Write-Host $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 15

          $possibleRoots = @(
              "$env:ProgramFiles\Microvirt",
              "${env:ProgramFiles(x86)}\Microvirt",
              "C:\Microvirt"
          )

          $memuExe = $null

          foreach ($root in $possibleRoots) {

              if (Test-Path $root) {

                  $found = Get-ChildItem `
                    -Path $root `
                    -Filter "MEmu.exe" `
                    -File `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($found) {
                      $memuExe = $found.FullName
                      break
                  }
              }
          }

          if (-not $memuExe) {

              Write-Host "Searching entire Program Files..."

              $found = Get-ChildItem `
                -Path "C:\Program Files","C:\Program Files (x86)" `
                -Filter "MEmu.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $memuExe = $found.FullName
              }
          }

          if (-not $memuExe) {

              Write-Host ""
              Write-Host "MEmu executable not found."
              Write-Host "Installed Microvirt directories:"

              Get-ChildItem `
                "C:\Program Files","C:\Program Files (x86)" `
                -Directory `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -match "MEmu|Microvirt"
                } |
                Select-Object -First 50 FullName |
                Format-Table -AutoSize

              throw "MEmu installation could not be detected."
          }

          $memuDir = Split-Path $memuExe -Parent

          Write-Host "MEmu executable:"
          Write-Host $memuExe

          Write-Host "MEmu directory:"
          Write-Host $memuDir

          "MEMU_EXE=$memuExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "MEMU_PATH=$memuDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 6. FIND MEMUC
      # ============================================================
      - name: Locate MEMUC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " LOCATING MEMUC"
          Write-Host "============================================================"

          $roots = @(
              $env:MEMU_PATH,
              "C:\Program Files\Microvirt",
              "C:\Program Files (x86)\Microvirt"
          )

          $memuc = $null

          foreach ($root in $roots) {

              if (-not $root) {
                  continue
              }

              if (Test-Path $root) {

                  $found = Get-ChildItem `
                    -Path $root `
                    -Filter "memuc.exe" `
                    -File `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($found) {
                      $memuc = $found.FullName
                      break
                  }
              }
          }

          if (-not $memuc) {

              $found = Get-ChildItem `
                -Path "C:\Program Files","C:\Program Files (x86)" `
                -Filter "memuc.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $memuc = $found.FullName
              }
          }

          if (-not $memuc) {
              throw "MEMUC was not found."
          }

          Write-Host "MEMUC:"
          Write-Host $memuc

          "MEMUC=$memuc" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "MEMUC version/help test:"

          & $memuc 2>&1 |
            Select-Object -First 20 |
            Out-Host


      # ============================================================
      # 7. CHECK HOST VIRTUALIZATION
      # ============================================================
      - name: Check Virtualization
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host " VIRTUALIZATION CHECK"
          Write-Host "============================================================"

          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,VirtualizationFirmwareEnabled |
            Format-List

          Write-Host ""
          Write-Host "Hyper-V:"
          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All `
            -ErrorAction SilentlyContinue |
            Format-List FeatureName,State

          Write-Host ""
          Write-Host "System Information:"
          systeminfo | Select-String `
            "Hyper-V Requirements|Virtualization|VM Monitor"


      # ============================================================
      # 8. CREATE MEMU INSTANCE
      # ============================================================
      - name: Create MEmu Instance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CREATING MEMU INSTANCE"
          Write-Host "============================================================"

          $list = & $env:MEMUC listvms 2>&1

          Write-Host "Existing VMs:"
          $list | Out-Host

          $hasVm = $false

          if ($list -match "MEmu") {
              $hasVm = $true
          }

          if (-not $hasVm) {

              Write-Host "No MEmu instance detected."
              Write-Host "Creating default MEmu instance..."

              & $env:MEMUC create 2>&1 |
                Out-Host

              Start-Sleep -Seconds 8
          }

          $list2 = & $env:MEMUC listvms 2>&1

          Write-Host ""
          Write-Host "VM list after creation:"
          $list2 | Out-Host

          if ($list2 -notmatch "MEmu") {
              throw "MEmu VM was not created."
          }


      # ============================================================
      # 9. CONFIGURE MEMU PERFORMANCE
      # ============================================================
      - name: Configure MEmu Performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " MEMU PERFORMANCE CONFIGURATION"
          Write-Host "============================================================"

          $vm = 0

          function Set-MEmuConfig {
              param(
                  [string]$Key,
                  [string]$Value
              )

              Write-Host ""
              Write-Host "Setting $Key = $Value"

              $result = & $env:MEMUC `
                setconfigex `
                -i $vm `
                $Key `
                $Value `
                2>&1

              $result | Out-Host
          }

          # CPU
          Set-MEmuConfig "cpus" "4"

          # RAM
          Set-MEmuConfig "memory" "4096"

          # 1280x720 @ 160 DPI
          Set-MEmuConfig `
            "custom_resolution" `
            "1280 720 160"

          # Keep fixed resolution
          Set-MEmuConfig `
            "disable_resize" `
            "1"

          # Accelerated cache mode
          Set-MEmuConfig `
            "cache_mode" `
            "1"

          Write-Host ""
          Write-Host "Reading back configuration..."

          foreach ($key in @(
              "cpus",
              "memory",
              "custom_resolution",
              "disable_resize",
              "cache_mode"
          )) {

              Write-Host ""
              Write-Host "[$key]"

              & $env:MEMUC `
                getconfigex `
                -i $vm `
                $key `
                2>&1 |
                Out-Host
          }

          Write-Host ""
          Write-Host "MEmu performance configuration completed."


      # ============================================================
      # 10. START MEMU
      # ============================================================
      - name: Start MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " STARTING MEMU"
          Write-Host "============================================================"

          & $env:MEMUC `
            start `
            -i 0 `
            2>&1 |
            Out-Host

          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "MEmu status:"

          & $env:MEMUC `
            isvmrunning `
            -i 0 `
            2>&1 |
            Out-Host


      # ============================================================
      # 11. BOOST MEMU PRIORITY
      # ============================================================
      - name: Boost MEmu Performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " BOOSTING MEMU PROCESS PRIORITY"
          Write-Host "============================================================"

          $names = @(
              "MEmu",
              "MEmuHeadless",
              "MEmuVM",
              "MEmuSVC",
              "MEmuHyperv",
              "MEmuConsole"
          )

          for ($round = 1; $round -le 5; $round++) {

              foreach ($name in $names) {

                  Get-Process `
                    -Name $name `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {

                      try {

                          $_.PriorityClass = "High"

                          Write-Host `
                            "High priority -> $($_.ProcessName) PID=$($_.Id)"

                      }
                      catch {

                          Write-Host `
                            "Could not change priority -> $($_.ProcessName)"
                      }
                  }
              }

              Start-Sleep -Seconds 3
          }


      # ============================================================
      # 12. WAIT FOR MEMU
      # ============================================================
      - name: Verify MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " VERIFYING MEMU"
          Write-Host "============================================================"

          $running = $false

          for ($i = 1; $i -le 30; $i++) {

              $status = & $env:MEMUC `
                isvmrunning `
                -i 0 `
                2>$null

              Write-Host "MEmu check $i/30 : $status"

              if ($status -match "running|yes|1|true") {
                  $running = $true
                  break
              }

              $processes = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($processes) {
                  $running = $true
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $running) {

              Write-Host ""
              Write-Host "MEmu failed to start."

              Write-Host ""
              Write-Host "VM LIST:"
              & $env:MEMUC listvms 2>&1 |
                Out-Host

              Write-Host ""
              Write-Host "MEMU PROCESSES:"
              Get-Process |
                Where-Object {
                    $_.ProcessName -match "MEmu|Microvirt"
                } |
                Select-Object Id,ProcessName,CPU,WorkingSet |
                Format-Table -AutoSize

              throw "MEmu did not start."
          }

          Write-Host ""
          Write-Host "MEmu is running."


      # ============================================================
      # 13. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " INSTALLING TAILSCALE"
          Write-Host "============================================================"

          $tsUrl = `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installer `
            -UseBasicParsing

          Start-Process `
            msiexec.exe `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed."


      # ============================================================
      # 14. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CONNECTING TAILSCALE"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (
                & $tailscale ip -4 2>$null |
                Select-Object -First 1
              ).Trim()

              Write-Host "Tailscale IP check $i/20 : $tsIP"

              if ($tsIP -match '^\d{1,3}(\.\d{1,3}){3}$') {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if ($tsIP -notmatch '^\d{1,3}(\.\d{1,3}){3}$') {
              throw "Tailscale IPv4 was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Tailscale IP: $tsIP"


      # ============================================================
      # 15. VERIFY RDP
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " VERIFYING RDP"
          Write-Host "============================================================"

          $service = Get-Service `
            -Name TermService

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
              Start-Service TermService
              Start-Sleep -Seconds 3
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP port 3389 is LISTENING."

          Write-Host ""
          Write-Host "Firewall rule:"
          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Select-Object DisplayName,Enabled,Direction,Action |
            Format-Table -AutoSize


      # ============================================================
      # 16. FINAL INFORMATION
      # ============================================================
      - name: Show RDP Access
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             RDP + MEMU PLAY READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "RDP Address : $env:TAILSCALE_IP"
          Write-Host "RDP Port    : 3389"
          Write-Host "Username    : RDP"
          Write-Host "Password    : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "MEMU SETTINGS"
          Write-Host "CPU         : 4 cores"
          Write-Host "RAM         : 4096 MB"
          Write-Host "Resolution  : 1280 x 720"
          Write-Host "DPI         : 160"
          Write-Host "Resize      : Disabled"
          Write-Host "Cache       : Accelerated"
          Write-Host "Priority    : High"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # 17. KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain RDP + MEmu
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host " RDP + MEMU RUNNING"
          Write-Host "============================================================"

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')]"

              # RDP
              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "RDP  : ACTIVE"
              }
              else {
                  Write-Host "RDP  : NOT LISTENING"
              }

              # MEmu
              $memu = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($memu) {

                  Write-Host "MEmu : RUNNING"

                  foreach ($p in $memu) {

                      try {
                          $p.PriorityClass = "High"
                      }
                      catch {}
                  }

              }
              else {

                  Write-Host "MEmu : NOT RUNNING"

                  Write-Host "Attempting MEmu restart..."

                  & $env:MEMUC `
                    start `
                    -i 0 `
                    2>&1 |
                    Out-Host

                  Start-Sleep -Seconds 15
              }

              # Tailscale
              $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

              if (Test-Path $tailscale) {

                  $ip = (
                    & $tailscale ip -4 2>$null |
                    Select-Object -First 1
                  ).Trim()

                  Write-Host "TS IP: $ip"
              }

              Start-Sleep -Seconds 300
          }
