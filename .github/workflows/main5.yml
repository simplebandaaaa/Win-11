name: Windows Gaming RDP

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:

      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Enabling Windows Remote Desktop"
          Write-Host "=========================================="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          Write-Host "=========================================="
          Write-Host " Creating RDP User"
          Write-Host "=========================================="

          $username = "gamer"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw @"
          RDP_PASSWORD GitHub Secret is missing or empty.

          Go to:
          Repository
          -> Settings
          -> Secrets and variables
          -> Actions
          -> New repository secret

          Name:
          RDP_PASSWORD

          Then add your RDP password and run the workflow again.
          "@
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Gaming RDP User"

              Write-Host "User created."

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Write-Host "Existing user password updated."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      # ==========================================
      # PERFORMANCE SETTINGS
      # ==========================================
      - name: Optimize Windows for RDP
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " Optimizing Windows RDP"
          Write-Host "=========================================="

          # Disable wallpaper
          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name Wallpaper `
            -Value ""

          # Disable visual effects
          New-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name VisualFXSetting `
            -PropertyType DWORD `
            -Value 2 `
            -Force

          # Enable Remote Desktop UDP
          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name fClientDisableUDP `
            -PropertyType DWORD `
            -Value 0 `
            -Force

          # Disable RDP bitmap caching
          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name DisableDiskCaching `
            -PropertyType DWORD `
            -Value 0 `
            -Force

          # Power plan
          powercfg /setactive SCHEME_MIN

          Write-Host "RDP performance settings applied."

      # ==========================================
      # INSTALL PCSX2
      # ==========================================
      - name: Install PCSX2
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host " Installing PCSX2"
          Write-Host "=========================================="

          $url = "https://github.com/PCSX2/pcsx2/releases/latest"

          try {

              winget install `
                --id PCSXR.PCSX2 `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                -e

              Write-Host "PCSX2 installation attempted."

          } catch {

              Write-Host "PCSX2 automatic installation failed."
              Write-Host "You can install it manually after connecting."

          }

      # ==========================================
      # TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ==========================================
      # SHOW RDP INFORMATION
      # ==========================================
      - name: Show RDP Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "===================================================="
          Write-Host "              WINDOWS GAMING RDP"
          Write-Host "===================================================="

          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "RDP IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Username:"
          Write-Host "gamer"

          Write-Host ""
          Write-Host "Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "===================================================="
          Write-Host " Connect using Microsoft Remote Desktop"
          Write-Host "===================================================="
          Write-Host ""

      # ==========================================
      # CHECK RDP SERVICE
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |

          Write-Host "Checking RDP service..."

          Get-Service TermService

          Write-Host ""
          Write-Host "Checking port 3389..."

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP verification complete."

      # ==========================================
      # KEEP MACHINE ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "===================================================="
          Write-Host " RDP SERVER IS RUNNING"
          Write-Host "===================================================="
          Write-Host ""
          Write-Host "Username: gamer"
          Write-Host "Port: 3389"
          Write-Host ""
          Write-Host "Keep this GitHub Actions job running"
          Write-Host "while you are using the RDP."
          Write-Host ""

          while ($true) {

              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host "$time - RDP server alive"

              Start-Sleep -Seconds 60
          }
