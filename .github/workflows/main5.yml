name: Windows RDP + Tailscale + MEmu Download

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

    # ============================================================
    # 1. ENABLE RDP
    # ============================================================
    - name: Enable RDP
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "============================================"
        Write-Host " ENABLE WINDOWS RDP"
        Write-Host "============================================"

        Set-ItemProperty `
          -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" `
          -Value 0

        Set-ItemProperty `
          -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "UserAuthentication" `
          -Value 0

        Set-ItemProperty `
          -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "SecurityLayer" `
          -Value 0

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop" `
          -ErrorAction SilentlyContinue

        netsh advfirewall firewall add rule `
          name="RDP-Tailscale" `
          dir=in `
          action=allow `
          protocol=TCP `
          localport=3389 `
          profile=any

        Restart-Service TermService -Force

        Write-Host "RDP enabled."


    # ============================================================
    # 2. CREATE RDP USER
    # ============================================================
    - name: Create RDP User
      shell: powershell
      env:
        RDP_PASSWORD: ${{ secrets.MY_RDP_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"

        $username = "RDP"

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
          $password = "SecurePass@2026!"
          Write-Host "MY_RDP_PASSWORD not set."
          Write-Host "Temporary password: SecurePass@2026!"
        }
        else {
          $password = $env:RDP_PASSWORD
        }

        $securePassword = ConvertTo-SecureString `
          $password `
          -AsPlainText `
          -Force

        $user = Get-LocalUser `
          -Name $username `
          -ErrorAction SilentlyContinue

        if ($user) {
          Set-LocalUser `
            -Name $username `
            -Password $securePassword
        }
        else {
          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -PasswordNeverExpires `
            -AccountNeverExpires
        }

        Add-LocalGroupMember `
          -Group "Administrators" `
          -Member $username `
          -ErrorAction SilentlyContinue

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member $username `
          -ErrorAction SilentlyContinue

        Write-Host "RDP user ready."


    # ============================================================
    # 3. BASIC PERFORMANCE
    # ============================================================
    - name: Optimize Windows
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"

        powercfg /setactive SCHEME_MIN

        Set-ItemProperty `
          -Path "HKCU:\Control Panel\Desktop" `
          -Name "MenuShowDelay" `
          -Value "0" `
          -ErrorAction SilentlyContinue

        Write-Host "Windows performance tweaks applied."


    # ============================================================
    # 4. DOWNLOAD MEMU ONLY
    # ============================================================
    - name: Download MEmu Installer Only
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "============================================"
        Write-Host " DOWNLOAD MEMU ONLY"
        Write-Host "============================================"

        $downloadDir = "C:\MEmu"

        New-Item `
          -ItemType Directory `
          -Path $downloadDir `
          -Force | Out-Null

        $installer = "$downloadDir\MEmu-Setup.exe"

        $url = "https://www.memuplay.com/download.php?file_name=Memu-Setup&from=official_release"

        Write-Host "Downloading official MEmu installer..."
        Write-Host ""

        curl.exe `
          -L `
          --retry 5 `
          --retry-delay 5 `
          --connect-timeout 30 `
          --max-time 900 `
          -o "$installer" `
          "$url"

        if (-not (Test-Path $installer)) {
          throw "MEmu installer download failed."
        }

        $size = (Get-Item $installer).Length

        Write-Host ""
        Write-Host "============================================"
        Write-Host " MEMU DOWNLOAD COMPLETE"
        Write-Host "============================================"
        Write-Host "File: $installer"
        Write-Host "Size: $size bytes"
        Write-Host ""
        Write-Host "IMPORTANT:"
        Write-Host "MEmu has NOT been installed."
        Write-Host "You can install it manually through RDP."
        Write-Host "============================================"


    # ============================================================
    # 5. INSTALL TAILSCALE
    # ============================================================
    - name: Install Tailscale
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "============================================"
        Write-Host " INSTALL TAILSCALE"
        Write-Host "============================================"

        $msi = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest `
          -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
          -OutFile $msi

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$msi`" /qn /norestart" `
          -Wait

        $tailscale = `
          "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $tailscale)) {
          throw "Tailscale installation failed."
        }

        Write-Host "Tailscale installed."


    # ============================================================
    # 6. CONNECT TAILSCALE
    # ============================================================
    - name: Connect Tailscale
      shell: powershell
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "============================================"
        Write-Host " CONNECT TAILSCALE"
        Write-Host "============================================"

        if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
          throw "TAILSCALE_AUTH_KEY secret is missing."
        }

        $tailscale = `
          "C:\Program Files\Tailscale\tailscale.exe"

        & $tailscale up `
          --auth-key="$env:TS_AUTHKEY" `
          --hostname="github-memu-rdp"

        Start-Sleep -Seconds 5

        $ip = & $tailscale ip -4

        Write-Host ""
        Write-Host "============================================"
        Write-Host " RDP CONNECTION INFORMATION"
        Write-Host "============================================"
        Write-Host "Tailscale IP : $ip"
        Write-Host "Username     : RDP"
        Write-Host "Password     : MY_RDP_PASSWORD"
        Write-Host "Port         : 3389"
        Write-Host ""
        Write-Host "MEmu installer:"
        Write-Host "C:\MEmu\MEmu-Setup.exe"
        Write-Host "============================================"


    # ============================================================
    # 7. VERIFY RDP
    # ============================================================
    - name: Verify RDP
      shell: powershell
      run: |
        $rdp = Get-NetTCPConnection `
          -LocalPort 3389 `
          -State Listen `
          -ErrorAction SilentlyContinue

        if (-not $rdp) {
          throw "RDP port 3389 is not listening."
        }

        Write-Host "RDP 3389 is ONLINE."

        $tailscale = `
          "C:\Program Files\Tailscale\tailscale.exe"

        Write-Host ""
        Write-Host "Tailscale IP:"
        & $tailscale ip -4

        Write-Host ""
        Write-Host "MEmu installer:"
        Write-Host "C:\MEmu\MEmu-Setup.exe"


    # ============================================================
    # 8. KEEP RDP ALIVE
    # ============================================================
    - name: Keep RDP Alive
      shell: powershell
      run: |
        Write-Host "============================================"
        Write-Host " RDP IS READY"
        Write-Host "============================================"
        Write-Host ""
        Write-Host "Connect using the Tailscale IP."
        Write-Host ""
        Write-Host "After connecting:"
        Write-Host "1. Open C:\MEmu"
        Write-Host "2. Run MEmu-Setup.exe"
        Write-Host "3. Install MEmu manually"
        Write-Host ""
        Write-Host "============================================"

        while ($true) {

          $tailscale = `
            "C:\Program Files\Tailscale\tailscale.exe"

          $ip = & $tailscale ip -4 2>$null

          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Time: $(Get-Date)"
          Write-Host "Tailscale IP: $ip"
          Write-Host "RDP: $(if ($rdp) {'ONLINE'} else {'OFFLINE'})"
          Write-Host "MEmu installer: C:\MEmu\MEmu-Setup.exe"

          Start-Sleep -Seconds 60
        }
