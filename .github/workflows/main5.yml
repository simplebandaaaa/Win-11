name: RDP + Fast MEmu

on:
  workflow_dispatch:

jobs:
  rdp-memu:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0 `
            -Force

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP ready."


      # ============================================================
      # RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $password = "${{ secrets.MY_RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
              $password = "SecurePass@2026!"
          }

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name RDP `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser `
                -Name RDP `
                -Password $secure
          }
          else {
              New-LocalUser `
                -Name RDP `
                -Password $secure `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            Administrators `
            RDP `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            "Remote Desktop Users" `
            RDP `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # WINDOWS PERFORMANCE
      # ============================================================
      - name: Optimize Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          # High performance
          powercfg /setactive SCHEME_MIN 2>$null

          # Disable transparency
          reg add `
            "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            /v EnableTransparency `
            /t REG_DWORD `
            /d 0 `
            /f | Out-Null

          # Disable RDP wallpaper
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableWallpaper `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          # Disable RDP animations
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableMenuAnims `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          Write-Host "Windows optimized."


      # ============================================================
      # DOWNLOAD MEMU
      # ============================================================
      - name: Download MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\MEmu-Setup.exe"

          $url = "https://www.memuplay.com/download.php?file_name=Memu-Setup"

          Write-Host "Downloading MEmu..."

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          # 3 retries, 90 sec maximum per attempt
          & curl.exe `
            -L `
            "--fail" `
            "--retry" "2" `
            "--retry-delay" "2" `
            "--connect-timeout" "10" `
            "--max-time" "90" `
            "-A" "Mozilla/5.0" `
            "-o" $installer `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "MEmu download failed."
          }

          if (-not (Test-Path $installer)) {
              throw "MEmu installer missing."
          }

          $size = (Get-Item $installer).Length

          Write-Host "Installer size: $size bytes"

          if ($size -lt 1000000) {
              throw "Downloaded MEmu installer is invalid."
          }

          $bytes = [System.IO.File]::ReadAllBytes($installer)

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Downloaded file is not an EXE."
          }

          "MEMU_INSTALLER=$installer" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "MEmu download complete."


      # ============================================================
      # FAST INSTALL WITH HARD TIMEOUT
      # ============================================================
      - name: Install MEmu - 5 Minute Timeout
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $installer = $env:MEMU_INSTALLER

          Write-Host "============================================================"
          Write-Host " INSTALLING MEMU PLAY"
          Write-Host "============================================================"
          Write-Host "Hard timeout: 5 minutes"

          # Start installer without blocking PowerShell
          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -PassThru

          Write-Host "Installer PID: $($p.Id)"

          $start = Get-Date
          $foundMEmu = $false

          while ($true) {

              Start-Sleep -Seconds 5

              $elapsed = (
                (Get-Date) - $start
              ).TotalSeconds

              # ----------------------------------------------------
              # Check installer
              # ----------------------------------------------------
              $proc = Get-Process `
                -Id $p.Id `
                -ErrorAction SilentlyContinue

              if (-not $proc) {
                  Write-Host "MEmu installer process finished."
              }
              else {
                  Write-Host `
                    "Installing... $([int]$elapsed)s"
              }

              # ----------------------------------------------------
              # Check whether MEmu.exe appeared
              # ----------------------------------------------------
              $found = Get-ChildItem `
                -Path `
                  "C:\Program Files",
                  "C:\Program Files (x86)" `
                -Filter "MEmu.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {

                  $foundMEmu = $true

                  Write-Host ""
                  Write-Host "MEmu.exe detected:"
                  Write-Host $found.FullName

                  break
              }

              # ----------------------------------------------------
              # 5 minute hard timeout
              # ----------------------------------------------------
              if ($elapsed -ge 300) {

                  Write-Host ""
                  Write-Host "MEmu installation exceeded 5 minutes."

                  if ($proc) {
                      Write-Host "Stopping stuck installer..."
                      Stop-Process `
                        -Id $p.Id `
                        -Force `
                        -ErrorAction SilentlyContinue
                  }

                  throw "MEmu installer timed out after 5 minutes."
              }
          }

          if (-not $foundMEmu) {
              throw "MEmu.exe was not detected."
          }

          $memuPath = Split-Path `
            $found.FullName `
            -Parent

          "MEMU_EXE=$($found.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "MEMU_PATH=$memuPath" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "MEmu installation detected."


      # ============================================================
      # FIND MEMUC
      # ============================================================
      - name: Find MEMUC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Finding memuc.exe..."

          $memuc = Get-ChildItem `
            -Path `
              "C:\Program Files",
              "C:\Program Files (x86)" `
            -Filter "memuc.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $memuc) {
              throw "memuc.exe not found."
          }

          Write-Host "MEMUC:"
          Write-Host $memuc.FullName

          "MEMUC=$($memuc.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # MEMU PERFORMANCE CONFIG
      # ============================================================
      - name: Configure MEmu Fast Mode
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " MEMU FAST CONFIGURATION"
          Write-Host "============================================================"

          $vm = 0

          # CPU
          & $env:MEMUC `
            setconfigex `
            -i $vm `
            cpus `
            4 `
            2>&1 |
            Out-Host

          # RAM
          & $env:MEMUC `
            setconfigex `
            -i $vm `
            memory `
            4096 `
            2>&1 |
            Out-Host

          # 720p = less rendering/RDP bandwidth
          & $env:MEMUC `
            setconfigex `
            -i $vm `
            custom_resolution `
            "1280 720 160" `
            2>&1 |
            Out-Host

          # Fixed resolution
          & $env:MEMUC `
            setconfigex `
            -i $vm `
            disable_resize `
            1 `
            2>&1 |
            Out-Host

          # Cache
          & $env:MEMUC `
            setconfigex `
            -i $vm `
            cache_mode `
            1 `
            2>&1 |
            Out-Host

          Write-Host "MEmu fast configuration applied."


      # ============================================================
      # START MEMU
      # ============================================================
      - name: Start MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Starting MEmu..."

          & $env:MEMUC `
            start `
            -i 0 `
            2>&1 |
            Out-Host

          Start-Sleep -Seconds 10

          Write-Host "MEmu startup command completed."


      # ============================================================
      # BOOST PROCESS
      # ============================================================
      - name: Boost MEmu Priority
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $names = @(
            "MEmu",
            "MEmuHeadless",
            "MEmuVM",
            "MEmuHyperv",
            "MEmuSVC"
          )

          for ($i = 0; $i -lt 10; $i++) {

              foreach ($name in $names) {

                  Get-Process `
                    -Name $name `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {

                      try {
                          $_.PriorityClass = "High"
                      }
                      catch {}
                  }
              }

              Start-Sleep -Seconds 2
          }

          Write-Host "MEmu priority optimization complete."


      # ============================================================
      # VERIFY MEMU
      # ============================================================
      - name: Verify MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Checking MEmu..."

          $ok = $false

          for ($i = 1; $i -le 30; $i++) {

              $process = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($process) {

                  $ok = $true

                  Write-Host "MEmu RUNNING."
                  break
              }

              Write-Host "Waiting for MEmu... $i/30"

              Start-Sleep -Seconds 2
          }

          if (-not $ok) {

              Write-Host "MEmu process not detected."

              & $env:MEMUC listvms 2>&1 |
                Out-Host

              throw "MEmu failed to start."
          }


      # ============================================================
      # TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer `
            -UseBasicParsing

          Start-Process `
            msiexec.exe `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          if (-not (
            Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe"
          )) {
              throw "Tailscale installation failed."
          }


      # ============================================================
      # TAILSCALE CONNECT
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {
              throw "TAILSCALE_AUTH_KEY secret missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-memu-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {

              $ip = (
                & $ts ip -4 2>$null |
                Select-Object -First 1
              ).Trim()

              if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ($ip -notmatch '^\d{1,3}(\.\d{1,3}){3}$') {
              throw "Tailscale IP unavailable."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $ip"


      # ============================================================
      # RDP VERIFY
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
              Start-Service TermService
              Start-Sleep -Seconds 2
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP 3389 is not listening."
          }

          Write-Host "RDP is ready."


      # ============================================================
      # FINAL
      # ============================================================
      - name: Show Access
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              RDP + MEMU READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "MEmu:"
          Write-Host "CPU      : 4"
          Write-Host "RAM      : 4096 MB"
          Write-Host "Display  : 1280x720"
          Write-Host "DPI      : 160"
          Write-Host "Priority : High"
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep RDP And MEmu Alive
        shell: powershell
        run: |
          while ($true) {

              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              $memu = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "RDP  : ACTIVE"
              }
              else {
                  Write-Host "RDP  : DOWN"
              }

              if ($memu) {
                  Write-Host "MEmu : RUNNING"

                  foreach ($p in $memu) {
                      try {
                          $p.PriorityClass = "High"
                      }
                      catch {}
                  }
              }
              else {
                  Write-Host "MEmu : DOWN"
              }

              Start-Sleep -Seconds 60
          }
