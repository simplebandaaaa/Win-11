name: RDP + MEmu Fast

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # CONFIGURE RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CONFIGURING RDP"
          Write-Host "============================================================"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP configured."


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CREATING RDP USER"
          Write-Host "============================================================"

          $password = "${{ secrets.MY_RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
              $password = "SecurePass@2026!"
              Write-Host "MY_RDP_PASSWORD secret not found; using fallback password."
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "RDP user already exists."

              Set-LocalUser `
                -Name "RDP" `
                -Password $securePassword

          } else {

              New-LocalUser `
                -Name "RDP" `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "GitHub Actions RDP User"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              throw "RDP user creation failed."
          }

          Write-Host "RDP user ready."


      # ============================================================
      # WINDOWS PERFORMANCE
      # ============================================================
      - name: Optimize Windows For RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " OPTIMIZING WINDOWS"
          Write-Host "============================================================"

          # High performance power plan
          powercfg /setactive SCHEME_MIN 2>$null

          # Disable transparency
          reg add `
            "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            /v EnableTransparency `
            /t REG_DWORD `
            /d 0 `
            /f | Out-Null

          # Disable RDP wallpaper
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableWallpaper `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          # Disable menu animations
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableMenuAnims `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          # Disable full-window dragging
          reg add `
            "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            /v fDisableFullWindowDrag `
            /t REG_DWORD `
            /d 1 `
            /f | Out-Null

          Write-Host "Windows optimized."


      # ============================================================
      # CHECK RUNNER
      # ============================================================
      - name: Check Runner Hardware
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host " RUNNER INFORMATION"
          Write-Host "============================================================"

          $cpu = Get-CimInstance Win32_Processor

          Write-Host "CPU:"
          Write-Host $cpu.Name

          Write-Host "CPU Cores:"
          Write-Host $cpu.NumberOfCores

          Write-Host "Logical CPUs:"
          Write-Host $cpu.NumberOfLogicalProcessors

          Write-Host "Virtualization:"
          Write-Host $cpu.VirtualizationFirmwareEnabled

          Write-Host ""
          Write-Host "GPU:"

          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion |
            Format-Table -AutoSize


      # ============================================================
      # DOWNLOAD MEMU
      # ============================================================
      - name: Download MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " DOWNLOADING MEMU PLAY"
          Write-Host "============================================================"

          $installer = "$env:TEMP\MEmu-Setup.exe"

          $url = "https://www.memuplay.com/download.php?file_name=Memu-Setup"

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "URL:"
          Write-Host $url
          Write-Host ""

          Write-Host "Starting download..."

          & curl.exe `
            -L `
            "--fail" `
            "--retry" "2" `
            "--retry-delay" "2" `
            "--connect-timeout" "10" `
            "--max-time" "180" `
            "-A" "Mozilla/5.0" `
            "-o" $installer `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "MEmu download failed. curl exit code: $LASTEXITCODE"
          }

          if (-not (Test-Path $installer)) {
              throw "MEmu installer was not created."
          }

          $size = (Get-Item $installer).Length

          Write-Host ""
          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 1000000) {
              throw "Downloaded MEmu file is too small."
          }

          # Verify EXE header
          $stream = [System.IO.File]::OpenRead($installer)

          try {
              $a = $stream.ReadByte()
              $b = $stream.ReadByte()
          }
          finally {
              $stream.Dispose()
          }

          if ($a -ne 0x4D -or $b -ne 0x5A) {
              throw "Downloaded file is not a valid Windows EXE."
          }

          "MEMU_INSTALLER=$installer" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "MEmu installer downloaded successfully."


      # ============================================================
      # INSTALL MEMU - CORRECTED
      # ============================================================
      - name: Install MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " INSTALLING MEMU PLAY"
          Write-Host "============================================================"

          $installer = $env:MEMU_INSTALLER

          if (-not (Test-Path $installer)) {
              throw "MEmu installer not found: $installer"
          }

          Write-Host "Installer:"
          Write-Host $installer
          Write-Host ""

          # --------------------------------------------------------
          # Start silent installer and WAIT for actual exit
          # --------------------------------------------------------
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -PassThru `
            -Wait

          Write-Host ""
          Write-Host "Installer process finished."
          Write-Host "Installer exit code: $($process.ExitCode)"

          # Give Windows installer services a short moment
          Start-Sleep -Seconds 5

          # --------------------------------------------------------
          # Common MEmu installation directories
          # --------------------------------------------------------
          $searchPaths = @(
              "C:\Program Files\Microvirt",
              "C:\Program Files (x86)\Microvirt",
              "C:\Program Files\MEmu",
              "C:\Program Files (x86)\MEmu",
              "C:\Microvirt",
              "C:\MEmu",
              "$env:ProgramData\Microvirt"
          )

          $memuExe = $null
          $memucExe = $null

          Write-Host ""
          Write-Host "Searching common MEmu directories..."

          foreach ($path in $searchPaths) {

              if (Test-Path $path) {

                  Write-Host "Checking: $path"

                  $candidate = Get-ChildItem `
                    -Path $path `
                    -Filter "MEmu.exe" `
                    -File `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($candidate) {
                      $memuExe = $candidate.FullName
                      break
                  }

                  if (-not $memucExe) {

                      $candidate = Get-ChildItem `
                        -Path $path `
                        -Filter "memuc.exe" `
                        -File `
                        -Recurse `
                        -ErrorAction SilentlyContinue |
                        Select-Object -First 1

                      if ($candidate) {
                          $memucExe = $candidate.FullName
                      }
                  }
              }
          }

          # --------------------------------------------------------
          # Program Files fallback search
          # --------------------------------------------------------
          if (-not $memuExe) {

              Write-Host ""
              Write-Host "MEmu.exe not found in common locations."
              Write-Host "Searching Program Files..."

              $candidate = Get-ChildItem `
                -Path `
                  "C:\Program Files",
                  "C:\Program Files (x86)" `
                -Filter "MEmu.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($candidate) {
                  $memuExe = $candidate.FullName
              }
          }

          # --------------------------------------------------------
          # memuc.exe fallback search
          # --------------------------------------------------------
          if (-not $memucExe) {

              Write-Host ""
              Write-Host "Searching for memuc.exe..."

              $candidate = Get-ChildItem `
                -Path `
                  "C:\Program Files",
                  "C:\Program Files (x86)",
                  "C:\Microvirt" `
                -Filter "memuc.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($candidate) {
                  $memucExe = $candidate.FullName
              }
          }

          # --------------------------------------------------------
          # Registry detection
          # --------------------------------------------------------
          Write-Host ""
          Write-Host "Checking uninstall registry..."

          $registryHits = @()

          $registryPaths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          foreach ($regPath in $registryPaths) {

              $items = Get-ItemProperty `
                $regPath `
                -ErrorAction SilentlyContinue

              foreach ($item in $items) {

                  if ($item.DisplayName -match "MEmu|Microvirt") {

                      $registryHits += $item

                      Write-Host ""
                      Write-Host "MEmu registry entry:"
                      Write-Host "Name: $($item.DisplayName)"
                      Write-Host "Version: $($item.DisplayVersion)"
                      Write-Host "InstallLocation: $($item.InstallLocation)"
                  }
              }
          }

          # --------------------------------------------------------
          # Use registry InstallLocation if available
          # --------------------------------------------------------
          if (-not $memuExe) {

              foreach ($entry in $registryHits) {

                  if (
                    $entry.InstallLocation -and
                    (Test-Path $entry.InstallLocation)
                  ) {

                      Write-Host ""
                      Write-Host "Checking registry InstallLocation:"
                      Write-Host $entry.InstallLocation

                      $candidate = Get-ChildItem `
                        -Path $entry.InstallLocation `
                        -Filter "MEmu.exe" `
                        -File `
                        -Recurse `
                        -ErrorAction SilentlyContinue |
                        Select-Object -First 1

                      if ($candidate) {
                          $memuExe = $candidate.FullName
                          break
                      }

                      if (-not $memucExe) {

                          $candidate = Get-ChildItem `
                            -Path $entry.InstallLocation `
                            -Filter "memuc.exe" `
                            -File `
                            -Recurse `
                            -ErrorAction SilentlyContinue |
                            Select-Object -First 1

                          if ($candidate) {
                              $memucExe = $candidate.FullName
                          }
                      }
                  }
              }
          }

          # --------------------------------------------------------
          # Derive MEmu.exe from memuc.exe
          # --------------------------------------------------------
          if (-not $memuExe -and $memucExe) {

              $dir = Split-Path `
                $memucExe `
                -Parent

              $candidate = Join-Path `
                $dir `
                "MEmu.exe"

              if (Test-Path $candidate) {
                  $memuExe = $candidate
              }
          }

          # --------------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------------
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " MEMU DETECTION RESULT"
          Write-Host "============================================================"

          Write-Host "MEmu.exe : $memuExe"
          Write-Host "memuc.exe: $memucExe"
          Write-Host "Registry : $($registryHits.Count)"
          Write-Host "ExitCode : $($process.ExitCode)"

          if ($memuExe -or $memucExe) {

              Write-Host ""
              Write-Host "MEmu installation detected."

              if ($memuExe) {

                  "MEMU_EXE=$memuExe" |
                    Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append

                  "MEMU_PATH=$(Split-Path $memuExe -Parent)" |
                    Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append
              }

              if ($memucExe) {

                  "MEMUC=$memucExe" |
                    Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append
              }

              exit 0
          }

          # --------------------------------------------------------
          # DIAGNOSTICS
          # --------------------------------------------------------
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " MEMU WAS NOT DETECTED"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "MEmu/Microvirt directories:"

          Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)","C:\" `
            -Directory `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "MEmu|Microvirt"
            } |
            Select-Object FullName |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "MEmu-related processes:"

          Get-Process `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProcessName -match "MEmu|Microvirt"
            } |
            Select-Object `
              Id,
              ProcessName,
              CPU,
              WorkingSet |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "MEmu-related services:"

          Get-Service `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "MEmu|Microvirt" -or
              $_.DisplayName -match "MEmu|Microvirt"
            } |
            Select-Object `
              Name,
              DisplayName,
              Status |
            Format-Table -AutoSize

          throw "MEmu installer exited, but MEmu installation was not detected."


      # ============================================================
      # VERIFY MEMUC
      # ============================================================
      - name: Verify MEmu Control
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " VERIFYING MEMU"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:MEMUC)) {
              throw "memuc.exe was not detected."
          }

          if (-not (Test-Path $env:MEMUC)) {
              throw "MEMUC path does not exist: $env:MEMUC"
          }

          Write-Host "MEMUC:"
          Write-Host $env:MEMUC

          Write-Host ""
          Write-Host "Available VMs:"

          & $env:MEMUC listvms 2>&1 |
            Out-Host

          if ($LASTEXITCODE -ne 0) {
              Write-Host "memuc listvms returned exit code $LASTEXITCODE"
          }


      # ============================================================
      # MEMU PERFORMANCE CONFIG
      # ============================================================
      - name: Configure MEmu For Performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " MEMU PERFORMANCE CONFIGURATION"
          Write-Host "============================================================"

          # Default VM index
          $vm = 0

          Write-Host "Setting CPU: 4"

          & $env:MEMUC `
            setconfigex `
            -i $vm `
            cpus `
            4 `
            2>&1 |
            Out-Host

          Write-Host "Setting RAM: 4096 MB"

          & $env:MEMUC `
            setconfigex `
            -i $vm `
            memory `
            4096 `
            2>&1 |
            Out-Host

          Write-Host "Setting display: 1280x720 / DPI 160"

          & $env:MEMUC `
            setconfigex `
            -i $vm `
            custom_resolution `
            "1280 720 160" `
            2>&1 |
            Out-Host

          Write-Host "Disabling dynamic resize"

          & $env:MEMUC `
            setconfigex `
            -i $vm `
            disable_resize `
            1 `
            2>&1 |
            Out-Host

          Write-Host "Setting cache mode"

          & $env:MEMUC `
            setconfigex `
            -i $vm `
            cache_mode `
            1 `
            2>&1 |
            Out-Host

          Write-Host ""
          Write-Host "MEmu performance configuration completed."


      # ============================================================
      # START MEMU
      # ============================================================
      - name: Start MEmu
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " STARTING MEMU"
          Write-Host "============================================================"

          & $env:MEMUC `
            start `
            -i 0 `
            2>&1 |
            Out-Host

          Write-Host ""
          Write-Host "Waiting for MEmu process..."

          $started = $false

          for ($i = 1; $i -le 20; $i++) {

              $processes = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($processes) {

                  $started = $true

                  Write-Host "MEmu process detected."
                  break
              }

              Write-Host "Waiting... $i/20"

              Start-Sleep -Seconds 2
          }

          if (-not $started) {
              throw "MEmu process did not start."
          }


      # ============================================================
      # BOOST MEMU
      # ============================================================
      - name: Optimize MEmu Process
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host " BOOSTING MEMU PROCESS"
          Write-Host "============================================================"

          $names = @(
            "MEmu",
            "MEmuHeadless",
            "MEmuVM",
            "MEmuHyperv",
            "MEmuSVC"
          )

          for ($round = 1; $round -le 5; $round++) {

              foreach ($name in $names) {

                  Get-Process `
                    -Name $name `
                    -ErrorAction SilentlyContinue |
                    ForEach-Object {

                      try {
                          $_.PriorityClass = "High"

                          Write-Host `
                            "$($_.ProcessName) -> High"
                      }
                      catch {}
                  }
              }

              Start-Sleep -Seconds 2
          }

          Write-Host "MEmu process optimization completed."


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " INSTALLING TAILSCALE"
          Write-Host "============================================================"

          $installer = "$env:TEMP\tailscale.msi"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
              throw "Tailscale installer download failed."
          }

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Tailscale installed."


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " CONNECTING TAILSCALE"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-memu-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 1; $i -le 15; $i++) {

              $tsIP = (
                & $ts ip -4 2>$null |
                Select-Object -First 1
              ).Trim()

              if (
                $tsIP -match `
                '^\d{1,3}(\.\d{1,3}){3}$'
              ) {
                  break
              }

              Write-Host "Waiting for Tailscale IP... $i/15"

              Start-Sleep -Seconds 2
          }

          if (
            $tsIP -notmatch `
            '^\d{1,3}(\.\d{1,3}){3}$'
          ) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Tailscale IP: $tsIP"


      # ============================================================
      # VERIFY RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host " VERIFYING RDP"
          Write-Host "============================================================"

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {

              Write-Host "Starting TermService..."

              Start-Service `
                -Name "TermService"

              Start-Sleep -Seconds 2
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP 3389 is listening."

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              Write-Host "Local RDP listener exists, but Tailscale self-test failed."
              Write-Host "This does not necessarily mean remote RDP is unavailable."
          }
          else {
              Write-Host "RDP TCP test successful."
          }


      # ============================================================
      # FINAL ACCESS INFORMATION
      # ============================================================
      - name: Show RDP Access
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              RDP + MEMU READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "RDP Address : $env:TAILSCALE_IP"
          Write-Host "RDP Port    : 3389"
          Write-Host "Username    : RDP"
          Write-Host "Password    : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "MEmu Configuration:"
          Write-Host "CPU         : 4"
          Write-Host "RAM         : 4096 MB"
          Write-Host "Resolution  : 1280 x 720"
          Write-Host "DPI         : 160"
          Write-Host "Priority    : High"
          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Maintain RDP + MEmu
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " RDP + MEMU KEEP-ALIVE"
          Write-Host "============================================================"

          while ($true) {

              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              $memu = Get-Process `
                -Name "MEmu","MEmuHeadless","MEmuVM" `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "[$(Get-Date -Format HH:mm:ss)] RDP  : ACTIVE"
              }
              else {
                  Write-Host "[$(Get-Date -Format HH:mm:ss)] RDP  : DOWN"
              }

              if ($memu) {

                  Write-Host "[$(Get-Date -Format HH:mm:ss)] MEmu : RUNNING"

                  foreach ($p in $memu) {

                      try {
                          $p.PriorityClass = "High"
                      }
                      catch {}
                  }

              }
              else {

                  Write-Host "[$(Get-Date -Format HH:mm:ss)] MEmu : NOT RUNNING"
                  Write-Host "Attempting MEmu restart..."

                  & $env:MEMUC `
                    start `
                    -i 0 `
                    2>&1 |
                    Out-Host
              }

              Start-Sleep -Seconds 60
          }
