name: Ubuntu Waydroid Remote

on:
  workflow_dispatch:

jobs:
  waydroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Update Ubuntu
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      - name: Install desktop and remote GUI
        shell: bash
        run: |
          sudo apt-get install -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            x11-xserver-utils \
            xvfb \
            x11vnc \
            novnc \
            python3-websockify \
            curl \
            wget \
            ca-certificates \
            gnupg \
            lxc \
            adb

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Connect Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY GitHub Secret is missing."
            echo "Create a Tailscale auth key and add it as repository secret TS_AUTHKEY."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname=github-waydroid

          echo "Tailscale status:"
          sudo tailscale status

          echo "Tailscale IPv4:"
          sudo tailscale ip -4

      - name: Install Waydroid
        shell: bash
        run: |
          curl -fsSL https://repo.waydro.id | sudo bash

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y waydroid

          echo "Waydroid version:"
          waydroid --version || true

      - name: Check kernel requirements
        shell: bash
        run: |
          echo "Kernel:"
          uname -a

          echo
          echo "Binder:"
          ls -l /dev/binder* 2>/dev/null || true

          echo
          echo "Kernel config:"
          if [ -r /boot/config-$(uname -r) ]; then
            grep -E 'CONFIG_(ANDROID_BINDER|ASHMEM|MEMFD)' \
              /boot/config-$(uname -r) || true
          fi

          echo
          echo "LXC:"
          lxc-checkconfig || true

      - name: Initialize Waydroid
        shell: bash
        run: |
          sudo waydroid init -f

          echo "Waydroid initialization finished."

      - name: Start virtual XFCE desktop
        shell: bash
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

          dbus-run-session -- startxfce4 >/tmp/xfce.log 2>&1 &

          sleep 8

          echo "XFCE started."
          cat /tmp/xfce.log || true

      - name: Start Waydroid
        shell: bash
        run: |
          export DISPLAY=:99
          export XDG_SESSION_TYPE=x11

          sudo systemctl restart waydroid-container || true

          sleep 5

          waydroid session start >/tmp/waydroid-session.log 2>&1 &

          sleep 20

          echo "Waydroid session:"
          waydroid status || true

          echo
          echo "Waydroid log:"
          cat /tmp/waydroid-session.log || true

      - name: Start noVNC
        shell: bash
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            -rfbport 5900 \
            >/tmp/x11vnc.log 2>&1 &

          sleep 3

          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            >/tmp/novnc.log 2>&1 &

          sleep 3

          echo "noVNC started on localhost:6080"

      - name: Create connection helper
        shell: bash
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -n1)

          cat > /tmp/connection.txt <<EOF
          ================================
          GitHub Waydroid Remote Desktop
          ================================

          Tailscale IP:
          $TS_IP

          noVNC:
          http://$TS_IP:6080/vnc.html

          If vnc.html does not work:
          http://$TS_IP:6080/

          DISPLAY:
          :99

          Waydroid status:
          $(waydroid status 2>&1 || true)

          ================================
          EOF

          cat /tmp/connection.txt

      - name: Keep runner alive
        shell: bash
        run: |
          echo "Remote session is running."
          echo "Stop the workflow when finished."

          for i in $(seq 1 330); do
            echo "[$i/330]"

            echo "--- Waydroid ---"
            waydroid status || true

            echo "--- Tailscale ---"
            sudo tailscale status || true

            echo "--- Ports ---"
            ss -lntp | grep -E '5900|6080' || true

            sleep 60
          done

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p ~/waydroid-logs

          waydroid status \
            > ~/waydroid-logs/waydroid-status.txt 2>&1 || true

          sudo journalctl -u waydroid-container \
            > ~/waydroid-logs/waydroid-container.txt 2>&1 || true

          sudo tailscale status \
            > ~/waydroid-logs/tailscale.txt 2>&1 || true

          cp /tmp/waydroid-session.log \
            ~/waydroid-logs/waydroid-session.log 2>/dev/null || true

          cp /tmp/xfce.log \
            ~/waydroid-logs/xfce.log 2>/dev/null || true

          cp /tmp/novnc.log \
            ~/waydroid-logs/novnc.log 2>/dev/null || true

          tar -czf ~/waydroid-logs.tar.gz \
            -C ~/ waydroid-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waydroid-logs
          path: ~/waydroid-logs.tar.gz.
