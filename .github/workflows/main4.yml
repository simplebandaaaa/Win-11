name: Cloud Android Emulator

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check KVM
        run: |
          echo "=== KVM CHECK ==="
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            echo "KVM is available."
          else
            echo "ERROR: /dev/kvm is NOT available."
            echo "GitHub-hosted runner cannot run the accelerated Android emulator."
            exit 1
          fi

      - name: Install Docker
        run: |
          docker --version

      - name: Pull Android Emulator
        run: |
          docker pull \
            us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2

      - name: Start Android Emulator
        run: |
          docker run -d \
            --name android-emulator \
            --device /dev/kvm \
            --publish 8554:8554/tcp \
            --publish 5555:5555/tcp \
            us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2

      - name: Show emulator logs
        run: |
          sleep 20
          docker logs android-emulator

      - name: Check emulator
        run: |
          docker ps
          docker inspect android-emulator
