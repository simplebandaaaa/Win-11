name: Free Cloud Android WebRTC

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check KVM
        run: |
          echo "Checking KVM..."
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Pull Android Emulator
        run: |
          docker pull \
            us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2

      - name: Start Emulator
        run: |
          docker run -d \
            --name android \
            --device /dev/kvm \
            --mount type=tmpfs,destination=/data \
            -p 8554:8554 \
            -p 5555:5555 \
            us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2

      - name: Wait for Emulator
        run: |
          echo "Waiting for Android..."

          for i in $(seq 1 180); do
            if docker exec android \
              adb shell getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' | grep -q '^1$'; then
              echo "Android boot completed."
              break
            fi
            sleep 2
          done

          docker ps

      - name: Install Gateway dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            git

      - name: Download Google WebRTC Gateway
        run: |
          git clone --depth 1 \
            https://github.com/google/android-emulator-container-scripts.git \
            /tmp/android-emulator-container-scripts

      - name: Start WebRTC Gateway
        run: |
          cd /tmp/android-emulator-container-scripts/gateway

          chmod +x setup_env.sh

          ./setup_env.sh

          source venv/bin/activate

          nohup videobridge-gateway \
            --port=8080 \
            --emulator_host=127.0.0.1 \
            --emulator_port=8554 \
            > /tmp/gateway.log 2>&1 &

          sleep 5

          echo "=== Gateway ==="
          cat /tmp/gateway.log || true

      - name: Check Gateway
        run: |
          echo "=== Port 8080 ==="
          ss -lntp | grep 8080 || true

          echo "=== Port 8554 ==="
          ss -lntp | grep 8554 || true

          echo "=== Emulator ==="
          docker ps

      - name: Keep Android online
        run: |
          echo "======================================"
          echo "ANDROID EMULATOR IS RUNNING"
          echo "WEBRTC GATEWAY IS RUNNING"
          echo "======================================"

          while true; do
            echo "[$(date -u)] Android + WebRTC alive"
            docker ps --filter name=android
            sleep 60
          done
