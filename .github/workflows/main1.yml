name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale
          sudo brew services start tailscale
          sleep 5

          sudo tailscale up \
            --auth-key="${{ secrets.TS_AUTHKEY }}" \
            --hostname="github-macos-${{ github.run_id }}"

      - name: Create Remote User
        run: |
          USERNAME="remote"
          PASSWORD='Mac@12345'

          # Create user
          sudo sysadminctl \
            -addUser "$USERNAME" \
            -fullName "Remote User" \
            -password "$PASSWORD" \
            -admin

          echo "Remote user created."

      - name: Enable Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -configure \
            -users remote \
            -configure \
            -privs -all \
            -restart \
            -agent

          echo "Screen Sharing enabled."

      - name: Show Connection Details
        run: |
          echo "======================================"
          echo " MACOS REMOTE DESKTOP"
          echo "======================================"

          IP=$(tailscale ip -4)

          echo "Tailscale IP : $IP"
          echo "Username     : remote"
          echo "Password     : Mac@12345"
          echo "VNC Address  : $IP:5900"

          echo "======================================"

          tailscale status

      - name: Keep Session Alive
        run: |
          while true; do
            echo "[$(date)] macOS session running..."
            sleep 300
          done
