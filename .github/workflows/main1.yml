name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Setup Tailscale
        run: |
          brew install --quiet tailscale
          sudo brew services stop tailscale 2>/dev/null || true
          sudo brew services start tailscale

          sleep 5

          sudo tailscale up \
            --auth-key="${{ secrets.TS_AUTHKEY }}" \
            --hostname="github-macos-${{ github.run_id }}"

      - name: Configure macOS Screen Sharing
        run: |
          CURRENT_USER=$(stat -f "%Su" /dev/console)

          echo "User: $CURRENT_USER"

          # Enable Remote Management / Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all

          # Enable SSH as backup
          sudo systemsetup -setremotelogin on || true

          echo "Remote services configured."

      - name: Show Tailscale Address
        run: |
          echo "======================================"
          echo " TAILSCALE IP"
          echo "======================================"

          tailscale ip -4
          tailscale status

          echo "======================================"
          echo "Use a VNC client:"
          echo "vnc://TAILSCALE_IP:5900"
          echo "======================================"

      - name: Keep macOS Runner Alive
        run: |
          echo "macOS remote session is running..."
          echo "Press Cancel/Stop in GitHub Actions to terminate."

          while true; do
            echo "[$(date)] Remote session alive"
            sleep 300
          done
